<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JOJIFY</title><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #0b0b0b;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  padding-bottom: 105px;
}

header {
  padding: 22px 18px 14px;
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 3px;
}

.logo span {
  color: #1ed760;
}

.subtitle {
  color: #888;
  font-size: 12px;
  margin-top: 5px;
}

.tabs {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  overflow-x: auto;
}

.tab {
  flex: 1;
  min-width: 110px;
  border: none;
  border-radius: 12px;
  padding: 12px 10px;
  background: #181818;
  color: #aaa;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: #1ed760;
  color: #000;
}

.section {
  padding: 12px;
}

.search {
  width: 100%;
  padding: 15px;
  border: none;
  outline: none;
  border-radius: 12px;
  background: #1b1b1b;
  color: #fff;
  font-size: 15px;
  margin-bottom: 15px;
}

.search::placeholder {
  color: #777;
}

.status {
  color: #888;
  text-align: center;
  padding: 20px 5px;
  font-size: 14px;
}

.song {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #151515;
  border-radius: 13px;
  padding: 10px;
  margin-bottom: 9px;
  cursor: pointer;
}

.song:hover {
  background: #202020;
}

.cover {
  width: 58px;
  height: 58px;
  border-radius: 9px;
  background: #242424;
  object-fit: cover;
  flex-shrink: 0;
}

.songInfo {
  flex: 1;
  min-width: 0;
}

.songTitle {
  font-weight: bold;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

.playSmall {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: #1ed760;
  color: #000;
  font-size: 18px;
  cursor: pointer;
}

.radioCard {
  background: #151515;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 10px;
}

.radioName {
  font-weight: bold;
  margin-bottom: 6px;
}

.radioDetails {
  color: #888;
  font-size: 12px;
  margin-bottom: 12px;
}

.live {
  color: #ff3b30;
  font-weight: bold;
}

.radioButton {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #1ed760;
  color: #000;
  font-weight: bold;
  cursor: pointer;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(18,18,18,.98);
  border-top: 1px solid #292929;
  padding: 10px 12px;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.playerTop {
  display: flex;
  align-items: center;
  gap: 10px;
}

.playerCover {
  width: 45px;
  height: 45px;
  border-radius: 7px;
  background: #222;
  object-fit: cover;
}

.playerInfo {
  flex: 1;
  min-width: 0;
}

.playerTitle {
  font-weight: bold;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.playerArtist {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.control {
  border: none;
  background: transparent;
  color: #fff;
  font-size: 19px;
  cursor: pointer;
}

.mainPlay {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: #fff;
  color: #000;
  cursor: pointer;
  font-size: 16px;
}

.progressArea {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
}

.time {
  color: #888;
  font-size: 10px;
  width: 32px;
}

.progress {
  flex: 1;
  height: 4px;
  accent-color: #1ed760;
}

.volume {
  width: 80px;
  accent-color: #1ed760;
}

.preview {
  color: #1ed760;
  font-size: 10px;
  text-align: center;
  margin-top: 4px;
}

.hidden {
  display: none !important;
}

.empty {
  text-align: center;
  color: #777;
  padding: 40px 15px;
}

footer {
  text-align: center;
  color: #555;
  font-size: 11px;
  padding: 25px 10px;
}
</style></head><body><header>
  <div class="logo">JOJI<span>FY</span></div>
  <div class="subtitle">MUSIC • RADIO • YOUR SOUND</div>
</header><div class="tabs">
  <button class="tab active" id="songsTab">🎵 Songs</button>
  <button class="tab" id="malayalamTab">🇮🇳 Malayalam Radio</button>
  <button class="tab" id="worldTab">🌍 World Radio</button>
</div><!-- SONGS --><section id="songsSection" class="section"><input
id="songSearch"
class="search"
type="search"
placeholder="🔎 Search songs or artists..."
autocomplete="off"

«»

  <div id="songStatus" class="status">
    Loading JOJIFY music...
  </div>  <div id="songList"></div></section><!-- MALAYALAM RADIO --><section id="malayalamSection" class="section hidden"><input
id="malayalamSearch"
class="search"
type="search"
placeholder="🔎 Search Malayalam radio..."
autocomplete="off"

«»

  <div id="malayalamStatus" class="status">
    Loading Malayalam radio...
  </div>  <div id="malayalamList"></div></section><!-- WORLD RADIO --><section id="worldSection" class="section hidden"><input
id="worldSearch"
class="search"
type="search"
placeholder="🔎 Search radio stations..."
autocomplete="off"

«»

  <div id="worldStatus" class="status">
    Loading world radio...
  </div>  <div id="worldList"></div></section><footer>
  JOJIFY © 2026
</footer><!-- PLAYER --><div class="player">  <div class="playerTop"><img
  id="playerCover"
  class="playerCover"
  src=""
  alt=""
>

<div class="playerInfo">
  <div id="playerTitle" class="playerTitle">
    Nothing playing
  </div>

  <div id="playerArtist" class="playerArtist">
    JOJIFY
  </div>
</div>

<div class="controls">

  <button
    id="previousButton"
    class="control"
    title="Previous"
  >⏮</button>

  <button
    id="playButton"
    class="mainPlay"
    title="Play"
  >▶</button>

  <button
    id="nextButton"
    class="control"
    title="Next"
  >⏭</button>

</div>

  </div>  <div class="progressArea"><span id="currentTime" class="time">
  0:00
</span>

<input
  id="progress"
  class="progress"
  type="range"
  min="0"
  max="100"
  value="0"
>

<span id="duration" class="time">
  0:00
</span>

  </div>  <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:5px;">
    🔊
    <input
      id="volume"
      class="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.8"
    >
  </div>  <div id="previewMessage" class="preview hidden">
    30-second preview
  </div></div><audio id="audio" preload="metadata"></audio>

<script>

/* =========================================================
   JOJIFY CONFIG
   ========================================================= */

const SONG_API = "songs.json";

const RADIO_API =
  "https://de1.api.radio-browser.info/json/stations/search";

const PREVIEW_SECONDS = 30;


/* =========================================================
   ELEMENTS
   ========================================================= */

const audio = document.getElementById("audio");

const songList =
  document.getElementById("songList");

const songStatus =
  document.getElementById("songStatus");

const songSearch =
  document.getElementById("songSearch");

const malayalamList =
  document.getElementById("malayalamList");

const malayalamStatus =
  document.getElementById("malayalamStatus");

const malayalamSearch =
  document.getElementById("malayalamSearch");

const worldList =
  document.getElementById("worldList");

const worldStatus =
  document.getElementById("worldStatus");

const worldSearch =
  document.getElementById("worldSearch");

const playerCover =
  document.getElementById("playerCover");

const playerTitle =
  document.getElementById("playerTitle");

const playerArtist =
  document.getElementById("playerArtist");

const playButton =
  document.getElementById("playButton");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const progress =
  document.getElementById("progress");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const volume =
  document.getElementById("volume");

const previewMessage =
  document.getElementById("previewMessage");


/* =========================================================
   STATE
   ========================================================= */

let songs = [];
let filteredSongs = [];

let currentIndex = -1;

let currentType = "song";

let currentRadioList = [];

let currentRadioIndex = -1;

let previewTimer = null;


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatTime(seconds) {

  if (!Number.isFinite(seconds)) {
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2, "0");

  return minutes + ":" + secs;

}


function setDefaultCover() {

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="300"
           height="300">
        <rect width="100%" height="100%" fill="#202020"/>
        <text x="50%" y="52%"
              text-anchor="middle"
              fill="#1ed760"
              font-size="45"
              font-family="Arial"
              font-weight="bold">
          JOJIFY
        </text>
      </svg>
    `);

}


/* =========================================================
   LOAD SONG API
   ========================================================= */

async function loadSongs() {

  try {

    const response =
      await fetch(SONG_API + "?v=" + Date.now());

    if (!response.ok) {
      throw new Error("API error");
    }

    const data =
      await response.json();

    songs =
      Array.isArray(data.songs)
        ? data.songs.filter(song => song.audio)
        : [];

    filteredSongs = [...songs];

    renderSongs();

  } catch (error) {

    songStatus.textContent =
      "Could not load JOJIFY music.";

    console.error(error);

  }

}


/* =========================================================
   RENDER SONGS
   ========================================================= */

function renderSongs() {

  songList.innerHTML = "";

  if (!filteredSongs.length) {

    songStatus.textContent =
      "No songs found.";

    return;

  }

  songStatus.textContent =
    filteredSongs.length +
    " song" +
    (filteredSongs.length === 1 ? "" : "s");

  filteredSongs.forEach((song, index) => {

    const originalIndex =
      songs.indexOf(song);

    const card =
      document.createElement("div");

    card.className = "song";

    const cover =
      song.cover || setDefaultCover();

    card.innerHTML = `

      <img
        class="cover"
        src="${escapeHTML(cover)}"
        alt=""
        onerror="this.src='${setDefaultCover()}'"
      >

      <div class="songInfo">

        <div class="songTitle">
          ${escapeHTML(song.title)}
        </div>

        <div class="artist">
          ${escapeHTML(song.artist)}
        </div>

      </div>

      <button class="playSmall">
        ▶
      </button>

    `;

    card.addEventListener("click", () => {

      playSong(originalIndex);

    });

    songList.appendChild(card);

  });

}


/* =========================================================
   SONG SEARCH
   ========================================================= */

songSearch.addEventListener("input", () => {

  const query =
    songSearch.value
      .trim()
      .toLowerCase();

  if (!query) {

    filteredSongs = [...songs];

  } else {

    filteredSongs =
      songs.filter(song => {

        const title =
          String(song.title || "")
            .toLowerCase();

        const artist =
          String(song.artist || "")
            .toLowerCase();

        const album =
          String(song.album || "")
            .toLowerCase();

        return (
          title.includes(query) ||
          artist.includes(query) ||
          album.includes(query)
        );

      });

  }

  renderSongs();

});


/* =========================================================
   PLAY SONG
   ========================================================= */

function playSong(index) {

  if (!songs[index]) {
    return;
  }

  clearPreviewTimer();

  currentType = "song";

  currentIndex = index;

  const song =
    songs[index];

  audio.src = song.audio;

  audio.load();

  playerTitle.textContent =
    song.title || "Unknown Song";

  playerArtist.textContent =
    song.artist || "Unknown Artist";

  playerCover.src =
    song.cover || setDefaultCover();

  previewMessage.classList.remove("hidden");

  previewMessage.textContent =
    "30-second preview";

  audio.play()
    .then(() => {

      playButton.textContent = "⏸";

      startPreviewTimer();

    })
    .catch(error => {

      console.error(error);

      playerTitle.textContent =
        "Playback unavailable";

    });

}


/* =========================================================
   30 SECOND PREVIEW
   ========================================================= */

function startPreviewTimer() {

  clearPreviewTimer();

  previewTimer =
    setTimeout(() => {

      if (currentType !== "song") {
        return;
      }

      audio.pause();

      audio.currentTime = 0;

      playButton.textContent = "▶";

      previewMessage.textContent =
        "30-second preview finished";

    }, PREVIEW_SECONDS * 1000);

}


function clearPreviewTimer() {

  if (previewTimer) {

    clearTimeout(previewTimer);

    previewTimer = null;

  }

}


/* =========================================================
   PLAYER BUTTONS
   ========================================================= */

playButton.addEventListener("click", () => {

  if (!audio.src) {
    return;
  }

  if (audio.paused) {

    audio.play()
      .then(() => {

        playButton.textContent = "⏸";

        if (currentType === "song") {
          startPreviewTimer();
        }

      })
      .catch(console.error);

  } else {

    audio.pause();

    playButton.textContent = "▶";

    clearPreviewTimer();

  }

});


previousButton.addEventListener("click", () => {

  if (currentType === "song") {

    if (!songs.length) {
      return;
    }

    let index =
      currentIndex - 1;

    if (index < 0) {
      index = songs.length - 1;
    }

    playSong(index);

  }

  else {

    if (!currentRadioList.length) {
      return;
    }

    let index =
      currentRadioIndex - 1;

    if (index < 0) {
      index = currentRadioList.length - 1;
    }

    playRadio(
      currentRadioList,
      index
    );

  }

});


nextButton.addEventListener("click", () => {

  if (currentType === "song") {

    if (!songs.length) {
      return;
    }

    let index =
      currentIndex + 1;

    if (index >= songs.length) {
      index = 0;
    }

    playSong(index);

  }

  else {

    if (!currentRadioList.length) {
      return;
    }

    let index =
      currentRadioIndex + 1;

    if (index >= currentRadioList.length) {
      index = 0;
    }

    playRadio(
      currentRadioList,
      index
    );

  }

});


/* =========================================================
   AUDIO EVENTS
   ========================================================= */

audio.addEventListener("play", () => {

  playButton.textContent = "⏸";

});


audio.addEventListener("pause", () => {

  playButton.textContent = "▶";

});


audio.addEventListener("ended", () => {

  clearPreviewTimer();

  if (currentType === "song") {

    let next =
      currentIndex + 1;

    if (next >= songs.length) {
      next = 0;
    }

    playSong(next);

  }

});


audio.addEventListener("loadedmetadata", () => {

  duration.textContent =
    formatTime(audio.duration);

});


audio.addEventListener("timeupdate", () => {

  if (
    currentType !== "song" ||
    !Number.isFinite(audio.duration)
  ) {
    return;
  }

  currentTime.textContent =
    formatTime(audio.currentTime);

  progress.value =
    (audio.currentTime / audio.duration) * 100;

});


progress.addEventListener("input", () => {

  if (
    currentType !== "song" ||
    !Number.isFinite(audio.duration)
  ) {
    return;
  }

  audio.currentTime =
    (Number(progress.value) / 100) *
    audio.duration;

});


volume.addEventListener("input", () => {

  audio.volume =
    Number(volume.value);

});

audio.volume =
  Number(volume.value);


/* =========================================================
   RADIO
   ========================================================= */

async function loadMalayalamRadio(query = "") {

  malayalamStatus.textContent =
    "Searching Malayalam radio...";

  malayalamList.innerHTML = "";

  try {

    let url =
      RADIO_API +
      "?language=malayalam" +
      "&hidebroken=true" +
      "&limit=50" +
      "&order=votes" +
      "&reverse=true";

    if (query) {

      url +=
        "&name=" +
        encodeURIComponent(query);

    }

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("Radio API error");
    }

    const stations =
      await response.json();

    const valid =
      stations.filter(
        station => station.url_resolved
      );

    renderRadio(
      valid,
      malayalamList,
      malayalamStatus
    );

  } catch (error) {

    malayalamStatus.textContent =
      "Could not load radio stations.";

    console.error(error);

  }

}


async function loadWorldRadio(query = "") {

  worldStatus.textContent =
    "Searching world radio...";

  worldList.innerHTML = "";

  try {

    let url =
      RADIO_API +
      "?hidebroken=true" +
      "&limit=50" +
      "&order=votes" +
      "&reverse=true";

    if (query) {

      url +=
        "&name=" +
        encodeURIComponent(query);

    }

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("Radio API error");
    }

    const stations =
      await response.json();

    const valid =
      stations.filter(
        station => station.url_resolved
      );

    renderRadio(
      valid,
      worldList,
      worldStatus
    );

  } catch (error) {

    worldStatus.textContent =
      "Could not load world radio.";

    console.error(error);

  }

}


/* =========================================================
   RENDER RADIO
   ========================================================= */

function renderRadio(
  stations,
  container,
  status
) {

  container.innerHTML = "";

  if (!stations.length) {

    status.textContent =
      "No stations found.";

    return;

  }

  status.textContent =
    stations.length +
    " live station" +
    (stations.length === 1 ? "" : "s");

  stations.forEach((station, index) => {

    const card =
      document.createElement("div");

    card.className =
      "radioCard";

    const name =
      station.name ||
      "Unknown Station";

    const country =
      station.country ||
      "Unknown country";

    const codec =
      station.codec ||
      "LIVE";

    card.innerHTML = `

      <div class="radioName">
        ${escapeHTML(name)}
      </div>

      <div class="radioDetails">
        <span class="live">● LIVE</span>
        &nbsp; ${escapeHTML(country)}
        &nbsp; • &nbsp; ${escapeHTML(codec)}
      </div>

      <button class="radioButton">
        ▶ PLAY LIVE
      </button>

    `;

    card
      .querySelector(".radioButton")
      .addEventListener("click", () => {

        const list =
          Array.from(
            container.querySelectorAll(".radioCard")
          ).map(() => station);

        playRadio(
          stations,
          index
        );

      });

    container.appendChild(card);

  });

}


/* =========================================================
   PLAY RADIO
   ========================================================= */

function playRadio(
  stations,
  index
) {

  const station =
    stations[index];

  if (!station || !station.url_resolved) {
    return;
  }

  clearPreviewTimer();

  currentType = "radio";

  currentRadioList =
    stations;

  currentRadioIndex =
    index;

  audio.src =
    station.url_resolved;

  audio.load();

  playerTitle.textContent =
    station.name || "Live Radio";

  playerArtist.textContent =
    "🔴 LIVE • " +
    (station.country || "Radio");

  playerCover.src =
    station.favicon ||
    setDefaultCover();

  progress.value = 0;

  currentTime.textContent =
    "LIVE";

  duration.textContent =
    "LIVE";

  previewMessage.classList.add("hidden");

  audio.play()
    .then(() => {

      playButton.textContent = "⏸";

    })
    .catch(error => {

      console.error(error);

      playerTitle.textContent =
        "This station cannot play here";

    });

}


/* =========================================================
   RADIO SEARCH
   ========================================================= */

let malayalamSearchTimer;

malayalamSearch.addEventListener("input", () => {

  clearTimeout(malayalamSearchTimer);

  malayalamSearchTimer =
    setTimeout(() => {

      loadMalayalamRadio(
        malayalamSearch.value.trim()
      );

    }, 400);

});


let worldSearchTimer;

worldSearch.addEventListener("input", () => {

  clearTimeout(worldSearchTimer);

  worldSearchTimer =
    setTimeout(() => {

      loadWorldRadio(
        worldSearch.value.trim()
      );

    }, 400);

});


/* =========================================================
   TABS
   ========================================================= */

const songsTab =
  document.getElementById("songsTab");

const malayalamTab =
  document.getElementById("malayalamTab");

const worldTab =
  document.getElementById("worldTab");

const songsSection =
  document.getElementById("songsSection");

const malayalamSection =
  document.getElementById("malayalamSection");

const worldSection =
  document.getElementById("worldSection");


function activateTab(tab) {

  [songsTab, malayalamTab, worldTab]
    .forEach(button =>
      button.classList.remove("active")
    );

  [songsSection, malayalamSection, worldSection]
    .forEach(section =>
      section.classList.add("hidden")
    );

  tab.button.classList.add("active");

  tab.section.classList.remove("hidden");

}


songsTab.addEventListener("click", () => {

  activateTab({
    button: songsTab,
    section: songsSection
  });

});


malayalamTab.addEventListener("click", () => {

  activateTab({
    button: malayalamTab,
    section: malayalamSection
  });

  if (!malayalamList.children.length) {
    loadMalayalamRadio();
  }

});


worldTab.addEventListener("click", () => {

  activateTab({
    button: worldTab,
    section: worldSection
  });

  if (!worldList.children.length) {
    loadWorldRadio();
  }

});


/* =========================================================
   START
   ========================================================= */

loadSongs();

</script></body>
</html>
