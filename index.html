<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JOJIFY — Your Music. Your Vibe.</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.90)),
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px 15px 80px;
}

/* HEADER */

.jojify-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 18px 20px;
    margin-bottom: 18px;

    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;

    backdrop-filter: blur(12px);
}

.jojify-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.logo-icon {
    width: 44px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background: linear-gradient(135deg,#ff3333,#ff0066);

    color: white;
    font-size: 25px;
    font-weight: bold;
}

.logo-text {
    color: white;

    font-size: 27px;
    font-weight: 900;

    letter-spacing: 4px;
}

.logo-tagline {
    color: #aaa;

    font-size: 9px;
    font-weight: bold;

    letter-spacing: 1.5px;
}

.subtitle {
    text-align: center;

    color: #ccc;

    margin: 10px 0 25px;
}


/* SEARCH */

.search-box {
    display: flex;
    gap: 8px;

    margin-bottom: 20px;
}

.search-box input {
    flex: 1;

    padding: 15px;

    border: none;
    border-radius: 12px;

    font-size: 16px;

    outline: none;
}

.search-box button {
    padding: 15px 22px;

    border: none;
    border-radius: 12px;

    background: #ff3333;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* PLAYER */

.player {
    background: rgba(20,20,20,.94);

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 20px;
}

.cover {
    width: 180px;
    height: 180px;

    margin: 5px auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    background:
        linear-gradient(135deg,#ff3333,#ff0066);

    font-size: 70px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.4);
}

.now-playing {
    text-align: center;

    font-size: 20px;

    font-weight: bold;

    line-height: 1.4;
}

.artist {
    text-align: center;

    color: #aaa;

    margin-top: 6px;
}


/* AUDIO */

audio {
    width: 100%;

    margin-top: 20px;

    border-radius: 10px;
}


/* RESULTS */

.results {
    background: rgba(20,20,20,.94);

    border-radius: 20px;

    padding: 10px;
}

.result {
    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px;

    border-bottom:
        1px solid rgba(255,255,255,.12);
}

.result:last-child {
    border-bottom: none;
}

.cover-small {
    width: 65px;
    height: 65px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        linear-gradient(135deg,#ff3333,#ff0066);

    font-size: 28px;

    flex-shrink: 0;
}

.info {
    flex: 1;

    min-width: 0;
}

.name {
    font-weight: bold;

    line-height: 1.35;
}

.artist-name {
    color: #aaa;

    font-size: 13px;

    margin-top: 5px;
}

.play {
    border: none;

    background: #ff3333;

    color: white;

    border-radius: 50%;

    width: 44px;
    height: 44px;

    font-size: 17px;

    flex-shrink: 0;

    cursor: pointer;
}

.play:active {
    transform: scale(.9);
}

.message {
    text-align: center;

    color: #aaa;

    padding: 25px;
}


/* MOBILE */

@media (max-width: 600px) {

    .logo-tagline {
        display: none;
    }

    .logo-text {
        font-size: 22px;
    }

    .logo-icon {
        width: 38px;
        height: 38px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        width: 100%;
    }

    .cover {
        width: 150px;
        height: 150px;
    }
}
</style></head><body><div class="container"><!-- HEADER --><header class="jojify-header"><a href="#" class="jojify-logo">

    <span class="logo-icon">
        ♫
    </span>

    <span class="logo-text">
        JOJIFY
    </span>

</a>

<span class="logo-tagline">
    YOUR MUSIC. YOUR VIBE.
</span>

</header><div class="subtitle">
    Your music. Your vibe. 🎵
</div><!-- SEARCH --><div class="search-box"><input
    type="text"
    id="searchInput"
    placeholder="Search songs or artists..."
    autocomplete="off"
>

<button
    onclick="searchSongs()"
>
    Search
</button>

</div><!-- PLAYER --><div class="player"><div class="cover">
    ♫
</div>

<div
    class="now-playing"
    id="nowPlaying"
>
    Select a song
</div>

<div
    class="artist"
    id="nowArtist"
>
    JOJIFY
</div>


<audio
    id="audioPlayer"
    controls
    preload="metadata"
>
</audio>

</div><!-- SONG RESULTS --><div
    class="results"
    id="results"
><div class="message">
    Search for a song above 🎵
</div>

</div></div><script>

/*
=========================================================
JOJIFY FREE MUSIC PLAYER
=========================================================

No YouTube API.
No Google Cloud.
No external API key.

The demo tracks below are used only for testing.

Replace the "url" values with music files
that you have permission to use.
=========================================================
*/


const songs = [

    {
        title: "SoundHelix Song 1",
        artist: "SoundHelix",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
    },

    {
        title: "SoundHelix Song 2",
        artist: "SoundHelix",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
    },

    {
        title: "SoundHelix Song 3",
        artist: "SoundHelix",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
    }

];


const searchInput =
    document.getElementById(
        "searchInput"
    );

const results =
    document.getElementById(
        "results"
    );

const audioPlayer =
    document.getElementById(
        "audioPlayer"
    );

const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );

const nowArtist =
    document.getElementById(
        "nowArtist"
    );


/* SHOW ALL SONGS */

function showSongs(list) {

    results.innerHTML = "";


    if (list.length === 0) {

        results.innerHTML = `

            <div class="message">

                No songs found 🎵

            </div>

        `;

        return;
    }


    list.forEach(
        function(song, index) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "result";


            item.innerHTML = `

                <div class="cover-small">
                    ♫
                </div>

                <div class="info">

                    <div class="name">
                        ${escapeHTML(song.title)}
                    </div>

                    <div class="artist-name">
                        ${escapeHTML(song.artist)}
                    </div>

                </div>

                <button
                    class="play"
                    type="button"
                >
                    ▶
                </button>

            `;


            item
                .querySelector(".play")
                .addEventListener(
                    "click",
                    function() {

                        playSong(song);

                    }
                );


            results.appendChild(item);

        }
    );

}


/* PLAY */

function playSong(song) {

    audioPlayer.src =
        song.url;

    nowPlaying.textContent =
        song.title;

    nowArtist.textContent =
        song.artist;


    audioPlayer.play()
        .catch(
            function() {
                /* Browser may require
                   user interaction first. */
            }
        );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* SEARCH */

function searchSongs() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    if (!query) {

        showSongs(songs);

        return;
    }


    const filtered =
        songs.filter(
            function(song) {

                return (

                    song.title
                        .toLowerCase()
                        .includes(query)

                    ||

                    song.artist
                        .toLowerCase()
                        .includes(query)

                );

            }
        );


    showSongs(filtered);

}


/* ENTER KEY */

searchInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchSongs();

        }

    }
);


/* SECURITY */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* INITIAL SONG LIST */

showSongs(songs);

</script></body>
                                                 </html>
