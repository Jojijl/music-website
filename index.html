<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOJIFY</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #242424 0%, #0b0b0b 45%, #000 100%);
    color: white;
    min-height: 100vh;
    padding-bottom: 190px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 28px 15px 18px;
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo span {
    color: #1db954;
}

.subtitle {
    color: #aaa;
    margin-top: 7px;
    font-size: 13px;
}

/* TABS */

.tabs {
    display: flex;
    gap: 8px;
    padding: 0 15px 18px;
    overflow-x: auto;
}

.tab {
    border: 1px solid #333;
    background: #151515;
    color: #aaa;
    border-radius: 25px;
    padding: 11px 17px;
    white-space: nowrap;
    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    background: #1db954;
    color: black;
    border-color: #1db954;
}

/* SEARCH */

.search-box {
    padding: 0 15px 20px;
}

.search {
    width: 100%;
    padding: 15px 18px;
    border-radius: 30px;
    border: 1px solid #333;
    background: #171717;
    color: white;
    outline: none;
    font-size: 15px;
}

.search:focus {
    border-color: #1db954;
}

/* CONTENT */

.section {
    display: none;
    padding: 0 15px;
}

.section.active {
    display: block;
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 13px;
}

.message {
    text-align: center;
    color: #888;
    padding: 30px 10px;
}

/* RESULT */

.result {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px;
    margin-bottom: 8px;
    border-radius: 14px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.06);
    transition: 0.2s;
}

.result:hover {
    background: rgba(255,255,255,0.1);
}

.result img {
    width: 58px;
    height: 58px;
    object-fit: cover;
    border-radius: 10px;
    background: #222;
}

.info {
    flex: 1;
    min-width: 0;
}

.name {
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist-name {
    color: #999;
    font-size: 12px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.play {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #1db954;
    color: black;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
}

/* PLAYER */

.player {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 1000;

    background: rgba(20,20,20,0.94);
    backdrop-filter: blur(25px);
    border: 1px solid #333;
    border-radius: 24px;

    padding: 15px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.7);
}

.player-top {
    display: flex;
    align-items: center;
    gap: 13px;
}

.player-cover {
    width: 65px;
    height: 65px;
    border-radius: 13px;
    object-fit: cover;
    background: #222;
}

.track-info {
    flex: 1;
    min-width: 0;
}

.track-title {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.track-artist {
    font-size: 12px;
    color: #999;
    margin-top: 5px;
}

.live {
    color: #ff3b30;
    font-weight: bold;
}

/* PROGRESS */

.progress-area {
    margin-top: 12px;
}

.progress {
    width: 100%;
    height: 5px;
    appearance: none;
    background: #444;
    border-radius: 10px;
    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #1db954;
}

/* CONTROLS */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
}

.control {
    border: none;
    background: transparent;
    color: white;
    font-size: 21px;
    cursor: pointer;
}

.control-main {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 20px;
}

.time-row {
    display: flex;
    justify-content: space-between;
    color: #888;
    font-size: 10px;
    margin-top: 5px;
}

/* VOLUME */

.volume {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
}

.volume input {
    flex: 1;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    padding: 25px 10px;
}

/* MOBILE */

@media (max-width: 500px) {

    .logo {
        font-size: 32px;
    }

    .player {
        bottom: 7px;
        left: 7px;
        right: 7px;
    }

    body {
        padding-bottom: 205px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">
    <div class="logo">JOJI<span>FY</span></div>
    <div class="subtitle">Tunes • Malayalam Radio • World Radio</div>
</header>


<!-- TABS -->

<div class="tabs">

    <button class="tab active" onclick="showSection('songs', this)">
        🎵 Tunes
    </button>

    <button class="tab" onclick="showSection('malayalam', this)">
        🇮🇳 Malayalam Radio
    </button>

    <button class="tab" onclick="showSection('world', this)">
        🌍 World Radio
    </button>

</div>


<!-- SONG SEARCH -->

<section id="songs" class="section active">

    <div class="search-box">

        <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="🔎 Search song or artist..."
            autocomplete="off"
        >

    </div>

    <div class="section-title">
        🎵 30 Second Tunes
    </div>

    <div id="results">
        <div class="message">
            Search for a song or artist 🎧
        </div>
    </div>

</section>


<!-- MALAYALAM RADIO -->

<section id="malayalam" class="section">

    <div class="search-box">

        <input
            id="radioSearch"
            class="search"
            type="search"
            placeholder="🔎 Search Malayalam radio..."
            autocomplete="off"
        >

    </div>

    <div class="section-title">
        🇮🇳 Malayalam Radio
    </div>

    <div id="radioResults">
        <div class="message">
            Loading Malayalam radio... 📻
        </div>
    </div>

</section>


<!-- WORLD RADIO -->

<section id="world" class="section">

    <div class="search-box">

        <input
            id="worldRadioSearch"
            class="search"
            type="search"
            placeholder="🔎 Search world radio..."
            autocomplete="off"
        >

    </div>

    <div class="section-title">
        🌍 World Radio
    </div>

    <div id="worldResults">
        <div class="message">
            Loading world radio... 📻
        </div>
    </div>

</section>


<!-- PLAYER -->

<div class="player">

    <div class="player-top">

        <img
            id="cover"
            class="player-cover"
            src="background.jpg"
            alt="Cover"
            onerror="this.src='https://via.placeholder.com/300/111111/ffffff?text=JOJIFY'"
        >

        <div class="track-info">

            <div id="title" class="track-title">
                JOJIFY
            </div>

            <div id="artist" class="track-artist">
                Select a tune or radio station
            </div>

        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progress-area">

        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0"
        >

        <div class="time-row">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:30
            </span>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="control"
            onclick="previousItem()"
            title="Previous"
        >
            ⏮
        </button>

        <button
            id="playButton"
            class="control control-main"
            onclick="togglePlay()"
        >
            ▶
        </button>

        <button
            class="control"
            onclick="nextItem()"
            title="Next"
        >
            ⏭
        </button>

    </div>


    <!-- VOLUME -->

    <div class="volume">

        <span>🔊</span>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>

</div>


<audio id="audio" preload="none"></audio>


<div class="footer">
    JOJIFY • Music & Radio
</div>


<script>

/* =========================================================
   BASIC ELEMENTS
========================================================= */

const audio = document.getElementById("audio");

const title = document.getElementById("title");

const artist = document.getElementById("artist");

const cover = document.getElementById("cover");

const progress = document.getElementById("progress");

const currentTimeText =
    document.getElementById("currentTime");

const durationText =
    document.getElementById("duration");

const playButton =
    document.getElementById("playButton");

const volume =
    document.getElementById("volume");

const searchInput =
    document.getElementById("searchInput");

const results =
    document.getElementById("results");


/* =========================================================
   STATE
========================================================= */

let currentMode = "song";

let currentSongs = [];

let currentSongIndex = -1;

let radioStations = [];

let currentRadioIndex = -1;

let radioType = "";


/* =========================================================
   SECTION SWITCH
========================================================= */

function showSection(id, button) {

    document
        .querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

    document
        .querySelectorAll(".tab")
        .forEach(tab => {
            tab.classList.remove("active");
        });

    button.classList.add("active");

    if (id === "malayalam" &&
        document.getElementById("radioResults").children.length === 1) {

        loadMalayalamRadio();
    }

    if (id === "world" &&
        document.getElementById("worldResults").children.length === 1) {

        loadWorldRadio();
    }
}


/* =========================================================
   SONG SEARCH — iTunes
========================================================= */

function searchSongs() {

    const term =
        searchInput.value.trim();

    if (!term) {

        results.innerHTML =
            '<div class="message">' +
            'Type a song or artist name 🎵' +
            '</div>';

        return;
    }

    results.innerHTML =
        '<div class="message">' +
        'Searching... 🔎' +
        '</div>';

    const callbackName =
        "itunesCallback_" + Date.now();

    window[callbackName] = function(data) {

        delete window[callbackName];

        if (!data.results ||
            data.results.length === 0) {

            results.innerHTML =
                '<div class="message">' +
                'No songs found.' +
                '</div>';

            return;
        }

        currentSongs =
            data.results.filter(song =>
                song.trackName &&
                song.previewUrl
            );

        currentSongIndex = -1;

        results.innerHTML = "";

        if (!currentSongs.length) {

            results.innerHTML =
                '<div class="message">' +
                'No 30-second preview available.' +
                '</div>';

            return;
        }

        currentSongs.forEach((song, index) => {

            const div =
                document.createElement("div");

            div.className = "result";

            const artwork =
                song.artworkUrl100
                    ? song.artworkUrl100.replace(
                        /^http:/,
                        "https:"
                    )
                    : "background.jpg";

            div.innerHTML = `

                <img
                    src="${escapeHTML(artwork)}"
                    alt="Album"
                    onerror="this.src='background.jpg'"
                >

                <div class="info">

                    <div class="name">
                        ${escapeHTML(
                            song.trackName
                        )}
                    </div>

                    <div class="artist-name">
                        ${escapeHTML(
                            song.artistName ||
                            "Unknown Artist"
                        )}
                    </div>

                </div>

                <button class="play">
                    ▶
                </button>
            `;

            div
                .querySelector(".play")
                .onclick = function() {

                    playSong(index);

                };

            results.appendChild(div);

        });

    };

    const script =
        document.createElement("script");

    script.id = callbackName;

    script.src =
        "https://itunes.apple.com/search" +
        "?term=" +
        encodeURIComponent(term) +
        "&media=music" +
        "&entity=song" +
        "&limit=30" +
        "&country=IN" +
        "&callback=" +
        callbackName;

    script.onerror = function() {

        delete window[callbackName];

        results.innerHTML =
            '<div class="message">' +
            'Song search failed. Try again.' +
            '</div>';

        script.remove();

    };

    document.body.appendChild(script);
}


/* =========================================================
   PLAY SONG
========================================================= */

function playSong(index) {

    const song =
        currentSongs[index];

    if (!song ||
        !song.previewUrl) {

        return;
    }

    currentMode = "song";

    currentSongIndex = index;

    radioType = "";

    audio.pause();

    audio.src =
        song.previewUrl.replace(
            /^http:/,
            "https:"
        );

    title.textContent =
        song.trackName;

    artist.textContent =
        song.artistName ||
        "Unknown Artist";

    cover.src =
        song.artworkUrl100
            ? song.artworkUrl100.replace(
                /^http:/,
                "https:"
            )
            : "background.jpg";

    audio.play()
        .then(() => {

            playButton.textContent = "⏸";

        })
        .catch(error => {

            console.error(error);

            playButton.textContent = "▶";

        });
}


/* =========================================================
   FORCE 30 SECOND MAXIMUM
========================================================= */

audio.addEventListener("timeupdate", function() {

    if (currentMode !== "song") {
        return;
    }

    if (audio.currentTime >= 30) {

        audio.pause();

        audio.currentTime = 0;

        playButton.textContent = "▶";

        return;
    }

    updateProgress();

});


/* =========================================================
   RADIO BROWSER
========================================================= */

const RADIO_APIS = [

    "https://de1.api.radio-browser.info",

    "https://at1.api.radio-browser.info",

    "https://nl1.api.radio-browser.info"

];


/* =========================================================
   LOAD MALAYALAM RADIO
========================================================= */

async function loadMalayalamRadio(search = "") {

    const container =
        document.getElementById(
            "radioResults"
        );

    container.innerHTML =
        '<div class="message">' +
        'Finding Malayalam stations... 🔎' +
        '</div>';

    try {

        let stations =
            await getRadioStations(
                "malayalam",
                search
            );

        radioStations = stations;

        radioType = "malayalam";

        displayRadioStations(
            stations,
            container
        );

    } catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="message">' +
            'Radio could not be loaded. ' +
            'Try again 🔄' +
            '</div>';

    }
}


/* =========================================================
   LOAD WORLD RADIO
========================================================= */

async function loadWorldRadio(search = "") {

    const container =
        document.getElementById(
            "worldResults"
        );

    container.innerHTML =
        '<div class="message">' +
        'Finding world stations... 🔎' +
        '</div>';

    try {

        let stations =
            await getRadioStations(
                "",
                search
            );

        radioStations = stations;

        radioType = "world";

        displayRadioStations(
            stations,
            container
        );

    } catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="message">' +
            'World radio could not be loaded. ' +
            'Try again 🔄' +
            '</div>';

    }
}


/* =========================================================
   RADIO API REQUEST
========================================================= */

async function getRadioStations(
    language,
    search
) {

    let lastError;

    for (const api of RADIO_APIS) {

        try {

            let url =
                api +
                "/json/stations/search" +
                "?hidebroken=true" +
                "&limit=100" +
                "&order=votes" +
                "&reverse=true";

            if (language) {

                url +=
                    "&language=" +
                    encodeURIComponent(language);

            }

            if (search.trim()) {

                url +=
                    "&name=" +
                    encodeURIComponent(
                        search.trim()
                    );

            }

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Radio API error"
                );
            }

            const stations =
                await response.json();

            const filtered =
                stations.filter(station => {

                    return (
                        station.url_resolved &&
                        /^https?:\/\//i.test(
                            station.url_resolved
                        )
                    );

                });

            if (filtered.length) {

                return filtered;

            }

        } catch (error) {

            lastError = error;

        }

    }

    throw lastError ||
        new Error("No stations");
}


/* =========================================================
   DISPLAY RADIO
========================================================= */

function displayRadioStations(
    stations,
    container
) {

    container.innerHTML = "";

    if (!stations.length) {

        container.innerHTML =
            '<div class="message">' +
            'No playable stations found.' +
            '</div>';

        return;
    }

    stations.forEach(
        (station, index) => {

            const div =
                document.createElement("div");

            div.className = "result";

            const logo =
                station.favicon ||
                "background.jpg";

            div.innerHTML = `

                <img
                    src="${escapeHTML(logo)}"
                    alt="Radio"
                    onerror="this.src='background.jpg'"
                >

                <div class="info">

                    <div class="name">
                        ${escapeHTML(
                            station.name ||
                            "Radio Station"
                        )}
                    </div>

                    <div class="artist-name">
                        🔴 LIVE
                        ${
                            station.country
                                ? " • " +
                                  escapeHTML(
                                      station.country
                                  )
                                : ""
                        }
                    </div>

                </div>

                <button class="play">
                    ▶
                </button>
            `;

            div
                .querySelector(".play")
                .onclick = function() {

                    playRadio(index);

                };

            container.appendChild(div);

        }
    );
}


/* =========================================================
   PLAY RADIO
========================================================= */

function playRadio(index) {

    const station =
        radioStations[index];

    if (!station) {
        return;
    }

    currentMode = "radio";

    currentRadioIndex = index;

    audio.pause();

    audio.src =
        station.url_resolved;

    title.textContent =
        station.name ||
        "Live Radio";

    artist.innerHTML =
        '<span class="live">🔴 LIVE RADIO</span>';

    cover.src =
        station.favicon ||
        "background.jpg";

    progress.value = 0;

    currentTimeText.textContent =
        "LIVE";

    durationText.textContent =
        "LIVE";

    audio.play()
        .then(() => {

            playButton.textContent =
                "⏸";

        })
        .catch(error => {

            console.log(
                "Station failed:",
                station.name,
                error
            );

            playNextRadio();

        });
}


/* =========================================================
   NEXT RADIO
========================================================= */

function playNextRadio() {

    if (!radioStations.length) {
        return;
    }

    let next =
        currentRadioIndex + 1;

    if (next >= radioStations.length) {
        next = 0;
    }

    playRadio(next);
}


/* =========================================================
   PREVIOUS / NEXT
========================================================= */

function previousItem() {

    if (currentMode === "radio") {

        if (!radioStations.length) {
            return;
        }

        let index =
            currentRadioIndex - 1;

        if (index < 0) {
            index =
                radioStations.length - 1;
        }

        playRadio(index);

        return;
    }

    if (!currentSongs.length) {
        return;
    }

    let index =
        currentSongIndex - 1;

    if (index < 0) {
        index =
            currentSongs.length - 1;
    }

    playSong(index);
}


function nextItem() {

    if (currentMode === "radio") {

        playNextRadio();

        return;
    }

    if (!currentSongs.length) {
        return;
    }

    let index =
        currentSongIndex + 1;

    if (index >= currentSongs.length) {
        index = 0;
    }

    playSong(index);
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (!audio.src) {
        return;
    }

    if (audio.paused) {

        audio.play()
            .then(() => {

                playButton.textContent =
                    "⏸";

            })
            .catch(error => {

                console.error(error);

            });

    } else {

        audio.pause();

        playButton.textContent =
            "▶";
    }
}


/* =========================================================
   AUDIO EVENTS
========================================================= */

audio.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "⏸";

    }
);


audio.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶";

    }
);


audio.addEventListener(
    "ended",
    function() {

        if (currentMode === "song") {

            playButton.textContent =
                "▶";

        } else {

            playNextRadio();

        }

    }
);


audio.addEventListener(
    "error",
    function() {

        if (currentMode === "radio") {

            setTimeout(
                playNextRadio,
                300
            );

        }

    }
);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    if (
        !audio.duration ||
        !isFinite(audio.duration)
    ) {
        return;
    }

    const percent =
        (audio.currentTime /
        audio.duration) * 100;

    progress.value =
        Math.min(
            100,
            Math.max(0, percent)
        );

    currentTimeText.textContent =
        formatTime(
            audio.currentTime
        );

    durationText.textContent =
        formatTime(
            Math.min(
                30,
                audio.duration
            )
        );
}


progress.addEventListener(
    "input",
    function() {

        if (
            currentMode === "radio" ||
            !audio.duration
        ) {
            return;
        }

        audio.currentTime =
            (progress.value / 100) *
            audio.duration;

    }
);


/* =========================================================
   VOLUME
========================================================= */

volume.addEventListener(
    "input",
    function() {

        audio.volume =
            volume.value;

    }
);

audio.volume = 0.8;


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

    return minutes + ":" + secs;
}


/* =========================================================
   SEARCH EVENTS
========================================================= */

searchInput.addEventListener(
    "keydown",
    function(event) {

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text == null
            ? ""
            : String(text);

    return div.innerHTML;
}
