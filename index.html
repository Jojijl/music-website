<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #111;
    background-image:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.85)),
        url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 15px 100px;
}

h1 {
    text-align: center;
    color: #ff3333;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #ccc;
}

.search-box {
    display: flex;
    gap: 8px;
    margin: 25px 0;
}

.search-box input {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.search-box button {
    padding: 15px 18px;
    border: none;
    border-radius: 12px;
    background: #ff3333;
    color: white;
    font-weight: bold;
}

.player {
    background: rgba(20,20,20,.88);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
}

.cover {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 18px;
    display: block;
    margin: auto;
}

.song-title {
    text-align: center;
    font-size: 23px;
    margin-top: 15px;
}

.artist {
    text-align: center;
    color: #aaa;
    margin: 7px 0 15px;
}

audio {
    width: 100%;
}

.results {
    background: rgba(20,20,20,.88);
    border-radius: 20px;
    padding: 10px;
}

.result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.result img {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    object-fit: cover;
}

.info {
    flex: 1;
}

.name {
    font-weight: bold;
}

.artist-name {
    color: #aaa;
    font-size: 14px;
    margin-top: 5px;
}

.play {
    border: none;
    background: #ff3333;
    color: white;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 17px;
}

.message {
    text-align: center;
    color: #aaa;
    padding: 20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎵 MY MUSIC</h1>

    <div class="subtitle">
        Search for songs and listen to previews
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search songs or artists..."
        >

        <button onclick="searchSongs()">
            Search
        </button>
    </div>

    <div class="player">

        <img
            src="background.jpg"
            class="cover"
            id="cover"
        >

        <div class="song-title" id="title">
            Select a song
        </div>

        <div class="artist" id="artist">
            My Music
        </div>

        <audio id="audio" controls>
            Your browser does not support audio.
        </audio>

    </div>

    <div class="results" id="results">

        <div class="message">
            Search for a song above 🎵
        </div>

    </div>

</div>
<script>
const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const cover = document.getElementById("cover");
const results = document.getElementById("results");
const searchInput = document.getElementById("searchInput");

function searchSongs() {
    const term = searchInput.value.trim();

    if (!term) {
        results.innerHTML =
            '<div class="message">Type a song or artist name 🎵</div>';
        return;
    }

    results.innerHTML =
        '<div class="message">Searching... 🔎</div>';

    const callbackName =
        "itunesCallback_" + Date.now();

    window[callbackName] = function(data) {

        delete window[callbackName];

        if (!data.results || data.results.length === 0) {
            results.innerHTML =
                '<div class="message">No songs found.</div>';
            return;
        }

        results.innerHTML = "";

        data.results.forEach(song => {

            if (!song.trackName) return;

            const div = document.createElement("div");
            div.className = "result";

            const artwork =
                song.artworkUrl100
                ? song.artworkUrl100.replace(/^http:/, "https:")
                : "background.jpg";

            div.innerHTML = `
                <img src="${artwork}" alt="Album">

                <div class="info">
                    <div class="name">
                        ${escapeHTML(song.trackName)}
                    </div>

                    <div class="artist-name">
                        ${escapeHTML(song.artistName || "Unknown Artist")}
                    </div>
                </div>

                <button class="play">▶</button>
            `;

            div.querySelector(".play").onclick = function() {

                if (!song.previewUrl) {
                    alert("Preview not available for this song.");
                    return;
                }

                audio.src =
                    song.previewUrl.replace(/^http:/, "https:");

                title.textContent = song.trackName;
                artist.textContent =
                    song.artistName || "Unknown Artist";

                cover.src = artwork;

                audio.play();
            };

            results.appendChild(div);
        });

        const script = document.getElementById(callbackName);
        if (script) script.remove();
    };

    const script = document.createElement("script");

    script.id = callbackName;

    script.src =
        "https://itunes.apple.com/search" +
        "?term=" + encodeURIComponent(term) +
        "&media=music" +
        "&entity=song" +
        "&limit=20" +
        "&country=IN" +
        "&callback=" + callbackName;

    document.body.appendChild(script);
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        searchSongs();
    }
});
</script>

</body>
</html>
