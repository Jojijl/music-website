<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOJIFY — Your Music. Your Vibe.</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #111;
    background-image:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.85)),
        url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 15px 100px;
}

/* =========================
   JOJIFY HEADER
========================= */

.jojify-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    margin-bottom: 15px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.jojify-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.logo-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: linear-gradient(135deg, #ff3333, #ff0066);
    color: white;
    font-size: 25px;
    font-weight: bold;
    box-shadow: 0 6px 20px rgba(255, 51, 51, 0.35);
}

.logo-text {
    color: white;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo-tagline {
    color: #aaa;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

/* =========================
   SUBTITLE
========================= */

.subtitle {
    text-align: center;
    color: #ccc;
    margin-bottom: 5px;
}

/* =========================
   SEARCH
========================= */

.search-box {
    display: flex;
    gap: 8px;
    margin: 25px 0;
}

.search-box input {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.search-box button {
    padding: 15px 18px;
    border: none;
    border-radius: 12px;
    background: #ff3333;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.search-box button:hover {
    background: #ff0066;
}

/* =========================
   PLAYER
========================= */

.player {
    background: rgba(20,20,20,.88);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
}

.cover {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 18px;
    display: block;
    margin: auto;
}

.song-title {
    text-align: center;
    font-size: 23px;
    margin-top: 15px;
}

.artist {
    text-align: center;
    color: #aaa;
    margin: 7px 0 15px;
}

audio {
    width: 100%;
}

/* =========================
   RESULTS
========================= */

.results {
    background: rgba(20,20,20,.88);
    border-radius: 20px;
    padding: 10px;
}

.result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.result:last-child {
    border-bottom: none;
}

.result img {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    object-fit: cover;
}

.info {
    flex: 1;
}

.name {
    font-weight: bold;
}

.artist-name {
    color: #aaa;
    font-size: 14px;
    margin-top: 5px;
}

.play {
    border: none;
    background: #ff3333;
    color: white;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 17px;
    cursor: pointer;
}

.play:hover {
    background: #ff0066;
}

.message {
    text-align: center;
    color: #aaa;
    padding: 20px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {
        padding: 15px 12px 80px;
    }

    .jojify-header {
        padding: 15px;
    }

    .logo-text {
        font-size: 22px;
        letter-spacing: 3px;
    }

    .logo-icon {
        width: 38px;
        height: 38px;
        font-size: 21px;
    }

    .logo-tagline {
        display: none;
    }

    .cover {
        width: 160px;
        height: 160px;
    }

    .song-title {
        font-size: 20px;
    }

    .search-box input {
        min-width: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- JOJIFY HEADER -->

    <header class="jojify-header">

        <a href="#" class="jojify-logo">

            <span class="logo-icon">♫</span>

            <span class="logo-text">
                JOJIFY
            </span>

        </a>

        <span class="logo-tagline">
            YOUR MUSIC. YOUR VIBE.
        </span>

    </header>

    <!-- SUBTITLE -->

    <div class="subtitle">
        Search for songs and listen to previews
    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search songs or artists..."
        >

        <button onclick="searchSongs()">
            Search
        </button>

    </div>

    <!-- PLAYER -->

    <div class="player">

        <img
            src="background.jpg"
            class="cover"
            id="cover"
            alt="Album Cover"
        >

        <div class="song-title" id="title">
            Select a song
        </div>

        <div class="artist" id="artist">
            JOJIFY
        </div>

        <audio id="audio" controls>
            Your browser does not support audio.
        </audio>

    </div>

    <!-- SEARCH RESULTS -->

    <div class="results" id="results">

        <div class="message">
            Search for a song above 🎵
        </div>

    </div>

</div>

<script>

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const cover = document.getElementById("cover");
const results = document.getElementById("results");
const searchInput = document.getElementById("searchInput");


function searchSongs() {

    const term = searchInput.value.trim();

    if (!term) {

        results.innerHTML =
            '<div class="message">Type a song or artist name 🎵</div>';

        return;
    }

    results.innerHTML =
        '<div class="message">Searching... 🔎</div>';


    const callbackName =
        "itunesCallback_" + Date.now();


    window[callbackName] = function(data) {

        delete window[callbackName];


        if (!data.results || data.results.length === 0) {

            results.innerHTML =
                '<div class="message">No songs found.</div>';

            return;
        }


        results.innerHTML = "";


        data.results.forEach(song => {

            if (!song.trackName) return;


            const div = document.createElement("div");

            div.className = "result";


            const artwork =
                song.artworkUrl100
                ? song.artworkUrl100.replace(/^http:/, "https:")
                : "background.jpg";


            div.innerHTML = `

                <img
                    src="${artwork}"
                    alt="Album"
                >

                <div class="info">

                    <div class="name">
                        ${escapeHTML(song.trackName)}
                    </div>

                    <div class="artist-name">
                        ${escapeHTML(
                            song.artistName || "Unknown Artist"
                        )}
                    </div>

                </div>

                <button class="play">
                    ▶
                </button>

            `;


            div.querySelector(".play").onclick = function() {

                if (!song.previewUrl) {

                    alert(
                        "Preview not available for this song."
                    );

                    return;
                }


                audio.src =
                    song.previewUrl.replace(
                        /^http:/,
                        "https:"
                    );


                title.textContent =
                    song.trackName;


                artist.textContent =
                    song.artistName ||
                    "Unknown Artist";


                cover.src =
                    artwork;


                audio.play();

            };


            results.appendChild(div);

        });


        const script =
            document.getElementById(callbackName);

        if (script) {
            script.remove();
        }

    };


    const script =
        document.createElement("script");


    script.id =
        callbackName;


    script.src =
        "https://itunes.apple.com/search" +
        "?term=" +
        encodeURIComponent(term) +
        "&media=music" +
        "&entity=song" +
        "&limit=20" +
        "&country=IN" +
        "&callback=" +
        callbackName;


    document.body.appendChild(script);

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchSongs();

        }

    }
);

</script>

</body>
</html>
