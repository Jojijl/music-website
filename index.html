<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOJIFY — Music Player</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, #252525 0%, #101010 35%, #050505 75%);
    color: white;
    min-height: 100vh;
    padding-bottom: 110px;
}

header {
    padding: 22px 18px 12px;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: #1ed760;
}

.tagline {
    color: #999;
    font-size: 12px;
    margin-top: 5px;
}

.search-box {
    padding: 15px;
}

.search-box input {
    width: 100%;
    padding: 15px 18px;
    border-radius: 30px;
    border: 1px solid #292929;
    background: #181818;
    color: white;
    outline: none;
    font-size: 15px;
}

.search-box input:focus {
    border-color: #1ed760;
}

.categories {
    display: flex;
    gap: 9px;
    overflow-x: auto;
    padding: 3px 15px 15px;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    white-space: nowrap;
    padding: 9px 15px;
    border-radius: 20px;
    background: #191919;
    color: #aaa;
    border: 1px solid #292929;
    cursor: pointer;
    font-size: 13px;
}

.category.active {
    background: #1ed760;
    color: #000;
    border-color: #1ed760;
    font-weight: bold;
}

.section-title {
    padding: 8px 18px 12px;
    font-size: 21px;
    font-weight: 800;
}

.song-list {
    padding: 0 12px;
}

.song {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px;
    margin-bottom: 7px;
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
    cursor: pointer;
}

.song:hover {
    background: rgba(255,255,255,0.08);
}

.cover {
    width: 55px;
    height: 55px;
    border-radius: 9px;
    background: linear-gradient(135deg, #222, #444);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    color: #999;
    font-size: 12px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.play-small {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #1ed760;
    color: black;
    font-size: 15px;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #777;
    padding: 40px 20px;
}

.player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    background: rgba(13,13,13,0.97);
    backdrop-filter: blur(18px);
    border-top: 1px solid #292929;
    padding: 10px 14px 13px;
}

.now-playing {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 8px;
}

.now-cover {
    width: 45px;
    height: 45px;
    border-radius: 8px;
    background: linear-gradient(135deg,#1ed760,#0b6b35);
    display: flex;
    align-items: center;
    justify-content: center;
}

.now-info {
    flex: 1;
    min-width: 0;
}

.now-title {
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.now-artist {
    color: #999;
    font-size: 11px;
    margin-top: 3px;
}

.heart {
    background: none;
    border: none;
    color: #aaa;
    font-size: 22px;
    cursor: pointer;
}

.heart.active {
    color: #ff477e;
}

.progress-area {
    display: flex;
    align-items: center;
    gap: 8px;
}

.time {
    font-size: 10px;
    color: #888;
    width: 32px;
    text-align: center;
}

.progress {
    flex: 1;
    accent-color: #1ed760;
    cursor: pointer;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 8px;
}

.control {
    border: none;
    background: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.main-play {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: white;
    color: black;
    font-size: 18px;
    cursor: pointer;
}

.volume {
    position: absolute;
    right: 15px;
    bottom: 15px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.volume input {
    width: 70px;
    accent-color: #1ed760;
}

@media (max-width: 600px) {
    .volume {
        display: none;
    }

    .logo {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">JOJI<span>FY</span></div>
    <div class="tagline">Your music. Your mood.</div>
</header>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="Search songs, artists or movies..."
        oninput="renderSongs()"
    >
</div>

<div class="categories">
    <button class="category active" onclick="setCategory('All', this)">All</button>
    <button class="category" onclick="setCategory('Chill', this)">🌙 Chill</button>
    <button class="category" onclick="setCategory('Sad', this)">💔 Sad</button>
    <button class="category" onclick="setCategory('Happy', this)">😊 Happy</button>
    <button class="category" onclick="setCategory('Romantic', this)">❤️ Romantic</button>
    <button class="category" onclick="setCategory('Melody', this)">🎵 Melody</button>
    <button class="category" onclick="setCategory('Feel Good', this)">✨ Feel Good</button>
</div>

<div class="section-title">Made for you</div>

<div id="songList" class="song-list"></div>

<div class="player">

    <div class="now-playing">

        <div class="now-cover">🎵</div>

        <div class="now-info">
            <div id="nowTitle" class="now-title">Select a song</div>
            <div id="nowArtist" class="now-artist">JOJIFY</div>
        </div>

        <button id="heart" class="heart" onclick="toggleFavorite()">♡</button>

    </div>

    <div class="progress-area">

        <span id="currentTime" class="time">0:00</span>

        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            oninput="seekSong()"
        >

        <span id="duration" class="time">0:00</span>

    </div>

    <div class="controls">

        <button class="control" onclick="previousSong()">⏮</button>

        <button id="playButton" class="main-play" onclick="togglePlay()">▶</button>

        <button class="control" onclick="nextSong()">⏭</button>

    </div>

    <div class="volume">
        🔊
        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            oninput="changeVolume()"
        >
    </div>

</div>

<audio id="audio"></audio>

<script>

/* =========================================
   JOJIFY SONG LIBRARY
   Legal demo/royalty-free audio examples
========================================= */

const songs = [

    {
        title: "SoundHelix Song 1",
        artist: "SoundHelix",
        movie: "JOJIFY Demo",
        category: "Chill",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
    },

    {
        title: "SoundHelix Song 2",
        artist: "SoundHelix",
        movie: "JOJIFY Demo",
        category: "Feel Good",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
    },

    {
        title: "SoundHelix Song 3",
        artist: "SoundHelix",
        movie: "JOJIFY Demo",
        category: "Melody",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
    },

    {
        title: "SoundHelix Song 4",
        artist: "SoundHelix",
        movie: "JOJIFY Demo",
        category: "Happy",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
    },

    {
        title: "SoundHelix Song 5",
        artist: "SoundHelix",
        movie: "JOJIFY Demo",
        category: "Romantic",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
    },

    {
        title: "SoundHelix Song 6",
        artist: "SoundHelix",
        movie: "JOJIFY Demo",
        category: "Sad",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
    }

];

let currentList = songs;
let currentIndex = -1;
let currentSong = null;
let favorite = false;

const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

audio.volume = 0.8;


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds) {

    if (!isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);

    const secs = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + secs;
}


/* =========================================
   DISPLAY SONGS
========================================= */

function renderSongs() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filtered = songs.filter(song => {

        const matchesSearch =
            song.title.toLowerCase().includes(search) ||
            song.artist.toLowerCase().includes(search) ||
            song.movie.toLowerCase().includes(search);

        const matchesCategory =
            selectedCategory === "All" ||
            song.category === selectedCategory;

        return matchesSearch && matchesCategory;

    });

    currentList = filtered;

    const list = document.getElementById("songList");

    list.innerHTML = "";

    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">😕 No songs found</div>';

        return;
    }

    filtered.forEach((song, index) => {

        const div = document.createElement("div");

        div.className = "song";

        div.onclick = () => playSong(song, filtered);

        div.innerHTML = `

            <div class="cover">🎵</div>

            <div class="song-info">

                <div class="song-title">
                    ${song.title}
                </div>

                <div class="song-artist">
                    ${song.artist} • ${song.category}
                </div>

            </div>

            <button
                class="play-small"
                onclick="event.stopPropagation(); playSong(songs.indexOf(song), filtered)"
            >
                ▶
            </button>

        `;

        list.appendChild(div);

    });
}


/* =========================================
   CATEGORY
========================================= */

let selectedCategory = "All";

function setCategory(category, button) {

    selectedCategory = category;

    document.querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderSongs();
}


/* =========================================
   PLAY SONG
========================================= */

function playSong(songOrIndex, list = currentList) {

    let song;

    if (typeof songOrIndex === "number") {

        song = songs[songOrIndex];

        currentIndex = list.indexOf(song);

    } else {

        song = songOrIndex;

        currentIndex = list.indexOf(song);

    }

    if (!song) return;

    currentSong = song;
    currentList = list;

    audio.src = song.url;

    document.getElementById("nowTitle").textContent =
        song.title;

    document.getElementById("nowArtist").textContent =
        song.artist + " • " + song.movie;

    audio.play()
        .then(() => {

            playButton.textContent = "❚❚";

        })
        .catch(() => {

            playButton.textContent = "▶";

            alert(
                "This demo audio could not be played. Please try another track."
            );

        });

    favorite = false;

    updateHeart();

}


/* =========================================
   PLAY / PAUSE
========================================= */

function togglePlay() {

    if (!currentSong) {

        if (currentList.length > 0) {

            playSong(currentList[0], currentList);

        }

        return;
    }

    if (audio.paused) {

        audio.play();

        playButton.textContent = "❚❚";

    } else {

        audio.pause();

        playButton.textContent = "▶";

    }
}


/* =========================================
   NEXT
========================================= */

function nextSong() {

    if (!currentList.length) return;

    currentIndex =
        (currentIndex + 1) % currentList.length;

    playSong(
        currentList[currentIndex],
        currentList
    );
}


/* =========================================
   PREVIOUS
========================================= */

function previousSong() {

    if (!currentList.length) return;

    currentIndex =
        (currentIndex - 1 + currentList.length)
        % currentList.length;

    playSong(
        currentList[currentIndex],
        currentList
    );
}


/* =========================================
   AUDIO EVENTS
========================================= */

audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

    document.getElementById("currentTime")
        .textContent =
        formatTime(audio.currentTime);

    document.getElementById("duration")
        .textContent =
        formatTime(audio.duration);

});


audio.addEventListener("ended", () => {

    nextSong();

});


/* =========================================
   SEEK
========================================= */

function seekSong() {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

}


/* =========================================
   VOLUME
========================================= */

function changeVolume() {

    audio.volume = volume.value;

}


/* =========================================
   FAVORITE
========================================= */

function toggleFavorite() {

    if (!currentSong) return;

    favorite = !favorite;

    updateHeart();

}


function updateHeart() {

    const heart =
        document.getElementById("heart");

    heart.textContent =
        favorite ? "♥" : "♡";

    heart.classList.toggle(
        "active",
        favorite
    );

}


/* =========================================
   START
========================================= */

renderSongs();

</script>

</body>
    </html>
