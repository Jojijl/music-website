<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>JOJIFY ONE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#09090d;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px;
}

/* HEADER */

header{
  text-align:center;
  padding:28px 10px 22px;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
}

.logo span{
  color:#7c5cff;
}

.tagline{
  color:#888;
  margin-top:8px;
  font-size:14px;
}

/* MAIN ASK BOX */

.ask-box{
  background:#15151d;
  border:1px solid #292936;
  border-radius:22px;
  padding:16px;
}

textarea{
  width:100%;
  height:130px;
  resize:none;
  border:0;
  outline:0;
  border-radius:15px;
  background:#0d0d13;
  color:#fff;
  padding:16px;
  font-size:16px;
}

textarea::placeholder{
  color:#6f6f78;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  border:0;
  cursor:pointer;
  color:#fff;
  font-weight:700;
}

.voice{
  width:58px;
  border-radius:14px;
  background:#292936;
  font-size:22px;
}

.voice.listening{
  background:#e53935;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.06)}
}

.ask{
  flex:1;
  border-radius:14px;
  background:#7c5cff;
  font-size:16px;
}

/* LANGUAGE */

.language{
  width:100%;
  margin-top:12px;
  padding:12px;
  background:#0d0d13;
  color:#fff;
  border:1px solid #292936;
  border-radius:12px;
}

/* QUICK ACTIONS */

.quick-title{
  margin:25px 0 12px;
  color:#aaa;
  font-size:14px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick{
  background:#15151d;
  border:1px solid #292936;
  border-radius:15px;
  padding:16px;
  text-align:left;
}

.quick strong{
  display:block;
  margin-bottom:5px;
}

.quick small{
  color:#888;
}

/* STUDY */

.study{
  margin-top:25px;
  background:linear-gradient(145deg,#171522,#111119);
  border:1px solid #302c45;
  border-radius:20px;
  padding:18px;
}

.study-title{
  font-size:21px;
  font-weight:800;
}

.study-sub{
  color:#999;
  margin-top:5px;
  margin-bottom:15px;
}

.marks{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.mark{
  background:#24232e;
  padding:13px 5px;
  border-radius:12px;
}

.mark.active{
  background:#7c5cff;
}

/* RESULT */

.result{
  display:none;
  margin-top:20px;
  background:#15151d;
  border:1px solid #292936;
  border-radius:20px;
  padding:20px;
}

.result-title{
  font-size:21px;
  margin-bottom:15px;
}

.answer{
  color:#ddd;
  line-height:1.75;
  white-space:pre-line;
}

.section{
  border-top:1px solid #292936;
  margin-top:20px;
  padding-top:16px;
}

.section-title{
  color:#a995ff;
  font-weight:bold;
  margin-bottom:8px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.actions button{
  flex:1;
  background:#292936;
  padding:12px;
  border-radius:10px;
}

/* HISTORY */

.history{
  margin-top:25px;
}

.history-item{
  background:#15151d;
  border:1px solid #24242d;
  border-radius:10px;
  padding:12px;
  margin-top:8px;
  color:#bbb;
}

.status{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:9px;
}

footer{
  text-align:center;
  color:#555;
  padding:30px 0 15px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">
    JOJIFY <span>ONE</span>
  </div>

  <div class="tagline">
    Your everyday AI assistant.
  </div>
</header>


<!-- ASK -->

<div class="ask-box">

<textarea
id="question"
placeholder="Ask anything...

Try:
Explain photosynthesis
Solve 2x + 5 = 15
What is ALARA?
Write a leave message
Translate this sentence..."
></textarea>

<select id="language" class="language">
  <option value="en-IN">English</option>
  <option value="ml-IN">Malayalam</option>
  <option value="ta-IN">Tamil</option>
  <option value="hi-IN">Hindi</option>
  <option value="te-IN">Telugu</option>
  <option value="kn-IN">Kannada</option>
</select>

<div class="controls">

<button
class="voice"
id="voiceBtn"
onclick="startVoice()">
🎙️
</button>

<button
class="ask"
onclick="askJojify()">
✨ ASK JOJIFY
</button>

</div>

<div
class="status"
id="status">
Ready
</div>

</div>


<!-- QUICK ACTIONS -->

<div class="quick-title">
QUICK TOOLS
</div>

<div class="quick-grid">

<button
class="quick"
onclick="quickAsk('Explain this topic in simple words')">
<strong>🧠 Explain</strong>
<small>Make difficult things simple</small>
</button>

<button
class="quick"
onclick="quickAsk('Solve this step by step')">
<strong>🧮 Solve</strong>
<small>Show the working</small>
</button>

<button
class="quick"
onclick="quickAsk('Translate this into Malayalam')">
<strong>🌐 Translate</strong>
<small>Change the language</small>
</button>

<button
class="quick"
onclick="quickAsk('Rewrite this professionally')">
<strong>✍️ Rewrite</strong>
<small>Make text better</small>
</button>

</div>


<!-- STUDY -->

<div class="study">

<div class="study-title">
🎓 JOJIFY STUDY
</div>

<div class="study-sub">
Solve study questions in your exam format.
</div>

<div class="marks">

<button
class="mark active"
onclick="setMarks(2,this)">
2 MARK
</button>

<button
class="mark"
onclick="setMarks(5,this)">
5 MARK
</button>

<button
class="mark"
onclick="setMarks(10,this)">
10 MARK
</button>

</div>

</div>


<!-- RESULT -->

<div
class="result"
id="result">

<div
class="result-title"
id="resultTitle">
🤖 JOJIFY
</div>

<div
class="answer"
id="answer">
</div>


<div class="section">

<div class="section-title">
🧠 EASY MEMORY
</div>

<div id="memory">
</div>

</div>


<div class="section">

<div class="section-title">
❓ PRACTICE
</div>

<div id="practice">
</div>

</div>


<div class="section">

<div class="section-title">
🎤 VIVA
</div>

<div id="viva">
</div>

</div>


<div class="actions">

<button onclick="readAnswer()">
🔊 Read
</button>

<button onclick="saveQuestion()">
⭐ Save
</button>

</div>

</div>


<!-- HISTORY -->

<div class="history">

<h3>🕘 Recent</h3>

<div id="historyList">
</div>

</div>


<footer>
JOJIFY ONE • Made by Joji
</footer>

</div>


<script>

let selectedMarks = 2;
let currentAnswer = "";
let currentQuestion = "";


/* =========================
   MARK SELECTION
========================= */

function setMarks(mark,button){

selectedMarks = mark;

document
.querySelectorAll(".mark")
.forEach(x => x.classList.remove("active"));

button.classList.add("active");

if(currentQuestion){
askJojify();
}

}


/* =========================
   QUICK ASK
========================= */

function quickAsk(text){

const box =
document.getElementById("question");

box.value = text + "\n\n";

box.focus();

}


/* =========================
   VOICE
========================= */

function startVoice(){

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!Recognition){

alert(
"Voice recognition is not supported in this browser."
);

return;
}

const recognition =
new Recognition();

recognition.lang =
document.getElementById("language").value;

recognition.continuous = false;
recognition.interimResults = false;

const btn =
document.getElementById("voiceBtn");

const status =
document.getElementById("status");

btn.classList.add("listening");

status.innerText =
"🎙️ Listening...";

recognition.start();


recognition.onresult =
function(event){

const text =
event.results[0][0].transcript;

document.getElementById("question").value =
text;

status.innerText =
"Question received ✓";

btn.classList.remove("listening");

askJojify();

};


recognition.onerror =
function(){

status.innerText =
"Voice error. Try again.";

btn.classList.remove("listening");

};


recognition.onend =
function(){

btn.classList.remove("listening");

};

}


/* =========================
   MAIN JOJIFY
========================= */

function askJojify(){

const question =
document.getElementById("question")
.value
.trim();

if(!question){

alert("Ask JOJIFY something first.");

return;
}

currentQuestion = question;


/*
IMPORTANT:

This demo does not pretend to be
a real AI model.

For production, this function should
send the question to your secure backend.
*/

const result =
localDemoAnswer(question);

currentAnswer =
result.answer;


document.getElementById("resultTitle")
.innerText =
"🤖 JOJIFY • " + selectedMarks + " MARK ANSWER";

document.getElementById("answer")
.innerText =
result.answer;

document.getElementById("memory")
.innerText =
result.memory;

document.getElementById("practice")
.innerText =
result.practice;

document.getElementById("viva")
.innerText =
result.viva;

document.getElementById("result")
.style.display =
"block";

saveHistory(question);

}


/* =========================
   DEMO ANSWER ENGINE
========================= */

function localDemoAnswer(question){

const q =
question.toLowerCase();


/* ALARA */

if(q.includes("alara")){

return {

answer:

selectedMarks === 2

? `ALARA stands for As Low As Reasonably Achievable. It is a radiation protection principle used to minimize unnecessary radiation exposure.`

: selectedMarks === 5

? `ALARA means As Low As Reasonably Achievable.

It is an important principle of radiation protection.

Key points:
1. Reduce unnecessary exposure.
2. Minimize exposure time.
3. Increase distance from the radiation source.
4. Use appropriate shielding.
5. Avoid unnecessary repeat examinations.`

:

`ALARA — As Low As Reasonably Achievable

Definition:
ALARA is a fundamental radiation protection principle that aims to keep radiation exposure as low as reasonably achievable while obtaining the required diagnostic information.

Main principles:

1. Time — minimize exposure time.
2. Distance — increase distance from the radiation source.
3. Shielding — use appropriate protective barriers.
4. Justification — perform examinations only when justified.
5. Optimization — use an appropriate radiation dose.

Conclusion:
ALARA helps minimize unnecessary radiation exposure to patients and radiation workers.`,

memory:
"ALARA = As Low As Reasonably Achievable",

practice:
"What does ALARA stand for?",

viva:
"Why is ALARA important in radiology?"

};

}


/* TLD */

if(q.includes("tld") ||
q.includes("thermoluminescent")){

return {

answer:

selectedMarks === 2

? `TLD stands for Thermoluminescent Dosimeter. It is used to measure an individual's exposure to ionizing radiation.`

:

selectedMarks === 5

? `TLD stands for Thermoluminescent Dosimeter.

Principle:
Radiation stores energy in the TLD material. When heated, the stored energy is released as light. The amount of light is related to the radiation dose.

Advantages:
• Small
• Lightweight
• Reusable
• Sensitive
• Useful for personnel monitoring.`

:

`THERMOLUMINESCENT DOSIMETER (TLD)

Definition:
TLD is a radiation dosimeter used to monitor an individual's exposure to ionizing radiation.

Principle:
Ionizing radiation deposits energy in the TLD material. Electrons become trapped in energy levels. When the material is heated, the trapped energy is released as light. The light output is related to the radiation dose.

Working:
1. TLD is exposed to radiation.
2. Energy is stored.
3. The TLD is heated.
4. Light is released.
5. Light intensity is measured.
6. Dose is calculated.

Uses:
• Personnel monitoring
• Diagnostic radiology
• Radiotherapy
• Nuclear medicine

Conclusion:
TLD is an important device for monitoring occupational radiation exposure.`,

memory:
"TLD → Radiation → Heat → Light → Dose",

practice:
"What is the principle of TLD?",

viva:
"What is TLD used for?"

};

}


/* DEFAULT */

return {

answer:

selectedMarks === 2

? `For a 2-mark answer:

Define the topic clearly and mention one important point.

Topic:
${question}

A real AI connection is required for JOJIFY to generate a topic-specific answer.`

:

selectedMarks === 5

? `For a 5-mark answer:

1. Definition
2. Principle / basic concept
3. Important points
4. Example or application
5. Short conclusion

Topic:
${question}

A real AI connection is required for JOJIFY to generate the complete topic-specific answer.`

:

`10-MARK ANSWER

Topic:
${question}

Recommended structure:

1. Introduction
2. Definition
3. Principle
4. Classification / types
5. Detailed explanation
6. Advantages
7. Disadvantages
8. Applications
9. Important points
10. Conclusion

A real AI connection is required for JOJIFY to generate the complete answer.`,

memory:
"Understand → Key points → Recall → Practice",

practice:
"Write three questions from this topic.",

viva:
"Define the topic and explain its main principle."

};

}


/* =========================
   READ ANSWER
========================= */

function readAnswer(){

if(!currentAnswer)
return;

speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(currentAnswer);

speech.lang =
document.getElementById("language").value;

speech.rate = 0.9;

speechSynthesis.speak(speech);

}


/* =========================
   SAVE HISTORY
========================= */

function saveHistory(question){

let history =
JSON.parse(
localStorage.getItem("jojifyHistory") || "[]"
);

history.unshift(question);

history =
[...new Set(history)].slice(0,10);

localStorage.setItem(
"jojifyHistory",
JSON.stringify(history)
);

showHistory();

}


/* =========================
   SHOW HISTORY
========================= */

function showHistory(){

const history =
JSON.parse(
localStorage.getItem("jojifyHistory") || "[]"
);

document.getElementById("historyList")
.innerHTML =
history.map(q => {

const safe =
q.replace(/'/g,"\\'");

return `
<div
class="history-item"
onclick="loadHistory('${safe}')">
🔹 ${q}
</div>
`;

}).join("");

}


function loadHistory(question){

document.getElementById("question")
.value = question;

askJojify();

}


showHistory();

</script>

</body>
</html>
