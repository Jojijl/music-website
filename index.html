<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #111;
    background-image: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
                      url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 25px 15px 100px;
}

h1 {
    text-align: center;
    color: #ff3333;
    font-size: 36px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #ddd;
    margin-bottom: 25px;
}

.player {
    background: rgba(20,20,20,.85);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
}

.cover {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 18px;
    display: block;
    margin: auto;
}

.song-title {
    text-align: center;
    font-size: 24px;
    margin: 18px 0 5px;
}

.artist {
    text-align: center;
    color: #bbb;
    margin-bottom: 15px;
}

audio {
    width: 100%;
}

.song-list {
    background: rgba(20,20,20,.85);
    border-radius: 20px;
    padding: 15px;
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid rgba(255,255,255,.12);
    cursor: pointer;
}

.song:last-child {
    border-bottom: none;
}

.song:hover {
    background: rgba(255,255,255,.1);
    border-radius: 12px;
}

.number {
    color: #ff3333;
    font-weight: bold;
    width: 25px;
}

.song-info {
    flex: 1;
}

.song-name {
    font-weight: bold;
}

.song-artist {
    color: #aaa;
    font-size: 13px;
    margin-top: 4px;
}

.play-button {
    background: #ff3333;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 18px;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #aaa;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎵 MY MUSIC</h1>
    <div class="subtitle">Listen to your favourite songs</div>

    <div class="player">

        <img src="background.jpg" class="cover" id="cover">

        <div class="song-title" id="title">
            Select a song
        </div>

        <div class="artist" id="artist">
            My Music
        </div>

        <audio id="audio" controls>
            Your browser does not support audio.
        </audio>

    </div>

    <div class="song-list">

        <div class="song" onclick="playSong('song1.mp3','Song One','Artist One')">
            <div class="number">01</div>

            <div class="song-info">
                <div class="song-name">Song One</div>
                <div class="song-artist">Artist One</div>
            </div>

            <button class="play-button">▶</button>
        </div>


        <div class="song" onclick="playSong('song2.mp3','Song Two','Artist Two')">
            <div class="number">02</div>

            <div class="song-info">
                <div class="song-name">Song Two</div>
                <div class="song-artist">Artist Two</div>
            </div>

            <button class="play-button">▶</button>
        </div>


        <div class="song" onclick="playSong('song3.mp3','Song Three','Artist Three')">
            <div class="number">03</div>

            <div class="song-info">
                <div class="song-name">Song Three</div>
                <div class="song-artist">Artist Three</div>
            </div>

            <button class="play-button">▶</button>
        </div>

    </div>

    <div class="footer">
        © 2026 My Music
    </div>

</div>


<script>

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");

function playSong(file, songTitle, songArtist) {

    audio.src = file;

    title.innerText = songTitle;
    artist.innerText = songArtist;

    audio.play();
}

</script>

</body>
</html>
