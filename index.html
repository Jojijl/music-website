<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>JOJIFY CHAOS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.hud-box{
    background:rgba(0,0,0,.65);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    padding:10px 14px;
    color:#fff;
    font-size:14px;
    backdrop-filter:blur(8px);
}

#health{
    color:#42ff7b;
    font-weight:bold;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle at center,#173b25 0,#050505 65%);
    color:white;
    text-align:center;
    padding:20px;
}

#startScreen h1{
    font-size:clamp(42px,12vw,90px);
    letter-spacing:6px;
    font-weight:900;
}

#startScreen h1 span{
    color:#39ff70;
}

#startScreen p{
    margin:12px 0 25px;
    color:#bbb;
}

#startButton{
    border:0;
    background:#39ff70;
    color:#001008;
    padding:15px 35px;
    border-radius:14px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
    z-index:8;
    pointer-events:none;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 5px #000;
}

#crosshair::before{
    width:2px;
    height:20px;
    left:9px;
    top:0;
}

#crosshair::after{
    width:20px;
    height:2px;
    left:0;
    top:9px;
}

#mobileControls{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    display:none;
}

.mobileButton{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.5);
    color:#fff;
    font-size:22px;
    pointer-events:auto;
    touch-action:none;
}

#up{
    left:78px;
    bottom:135px;
}

#down{
    left:78px;
    bottom:20px;
}

#left{
    left:18px;
    bottom:77px;
}

#right{
    left:138px;
    bottom:77px;
}

#jump{
    right:110px;
    bottom:95px;
}

#shoot{
    right:25px;
    bottom:95px;
    background:rgba(255,60,60,.6);
}

#message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:30;
    color:white;
    background:rgba(0,0,0,.65);
    padding:10px 16px;
    border-radius:12px;
    opacity:0;
    transition:.2s;
    pointer-events:none;
}

@media(max-width:700px){
    #mobileControls{
        display:block;
    }

    #crosshair{
        display:none;
    }

    #hud{
        font-size:12px;
    }

    .hud-box{
        padding:8px 10px;
    }
}

@media(min-width:701px){
    #mobileControls{
        display:none;
    }
}
</style>
</head>

<body>

<div id="startScreen">
    <h1>JOJ<span>IFY</span> CHAOS</h1>
    <p>3D Island Battle • Survive • Fight • Explore</p>
    <button id="startButton">PLAY NOW</button>
</div>

<div id="hud">
    <div class="hud-box">
        👥 Players: <span id="players">8</span>
    </div>

    <div class="hud-box">
        ☠️ Kills: <span id="kills">0</span>
    </div>

    <div class="hud-box">
        ❤️ HP: <span id="health">100</span>
    </div>
</div>

<div id="crosshair"></div>

<div id="mobileControls">

    <button class="mobileButton" id="up">▲</button>
    <button class="mobileButton" id="down">▼</button>
    <button class="mobileButton" id="left">◀</button>
    <button class="mobileButton" id="right">▶</button>

    <button class="mobileButton" id="jump">🦘</button>
    <button class="mobileButton" id="shoot">🔫</button>

</div>

<div id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   GAME VARIABLES
========================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let enemies = [];

let bullets = [];

let keys = {};

let started = false;

let playerHealth = 100;
let kills = 0;

let velocityY = 0;
let onGround = true;

const playerSpeed = 0.12;


/* =========================
   START GAME
========================= */

document
    .getElementById("startButton")
    .addEventListener("click",startGame);


function startGame(){

    document
        .getElementById("startScreen")
        .style.display = "none";

    started = true;

    init();

}


/* =========================
   THREE.JS SETUP
========================= */

function init(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x79b9e6);

    scene.fog =
        new THREE.Fog(
            0x79b9e6,
            50,
            180
        );


    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.1,
            500
        );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    document.body.appendChild(renderer.domElement);


    clock =
        new THREE.Clock();


    /* LIGHT */

    const sunlight =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    sunlight.position.set(
        50,
        80,
        30
    );

    scene.add(sunlight);


    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x406040,
            1.4
        );

    scene.add(ambient);


    createIsland();

    createPlayer();

    createEnemies();

    setupControls();

    animate();

}


/* =========================
   ISLAND
========================= */

function createIsland(){

    const ground =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                75,
                82,
                5,
                64
            ),
            new THREE.MeshStandardMaterial({
                color:0x397a38
            })
        );

    ground.position.y = -2.5;

    scene.add(ground);


    /* WATER */

    const water =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                500,
                500
            ),
            new THREE.MeshStandardMaterial({
                color:0x187fa8,
                transparent:true,
                opacity:.75
            })
        );

    water.rotation.x =
        -Math.PI / 2;

    water.position.y =
        -5;

    scene.add(water);


    /* TREES */

    for(let i=0;i<45;i++){

        const angle =
            Math.random() *
            Math.PI * 2;

        const radius =
            15 +
            Math.random() * 55;

        const x =
            Math.cos(angle) * radius;

        const z =
            Math.sin(angle) * radius;


        createTree(x,z);

    }


    /* ROCKS */

    for(let i=0;i<25;i++){

        const x =
            (Math.random()-.5)*130;

        const z =
            (Math.random()-.5)*130;

        const rock =
            new THREE.Mesh(
                new THREE.DodecahedronGeometry(
                    1 + Math.random()*2
                ),
                new THREE.MeshStandardMaterial({
                    color:0x666666
                })
            );

        rock.position.set(
            x,
            1,
            z
        );

        scene.add(rock);

    }


    /* BUILDINGS */

    for(let i=0;i<8;i++){

        const building =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    8,
                    7,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:
                        new THREE.Color(
                            Math.random(),
                            .3 +
                            Math.random()*.4,
                            .3
                        )
                })
            );

        building.position.set(
            (Math.random()-.5)*100,
            3.5,
            (Math.random()-.5)*100
        );

        scene.add(building);

    }

}


/* =========================
   TREE
========================= */

function createTree(x,z){

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .5,
                .7,
                5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x704214
            })
        );

    trunk.position.set(
        x,
        2.5,
        z
    );

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                3.5,
                8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x126b32
            })
        );

    leaves.position.set(
        x,
        7,
        z
    );

    scene.add(leaves);

}


/* =========================
   PLAYER
========================= */

function createPlayer(){

    player =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.4,
                2,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0x2266ff
            })
        );

    body.position.y = 2;

    player.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .7,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0xffc59b
            })
        );

    head.position.y = 3.5;

    player.add(head);


    player.position.set(
        0,
        0,
        0
    );

    scene.add(player);


    camera.position.set(
        0,
        8,
        12
    );

}


/* =========================
   ENEMIES
========================= */

function createEnemies(){

    for(let i=0;i<7;i++){

        const enemy =
            new THREE.Group();


        const body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.4,
                    2,
                    1
                ),
                new THREE.MeshStandardMaterial({
                    color:0xff3030
                })
            );

        body.position.y = 2;

        enemy.add(body);


        const head =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .7,
                    16,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color:0xffc59b
                })
            );

        head.position.y = 3.5;

        enemy.add(head);


        enemy.position.set(
            (Math.random()-.5)*80,
            0,
            (Math.random()-.5)*80
        );


        enemy.userData.health = 3;

        scene.add(enemy);

        enemies.push(enemy);

    }

}


/* =========================
   CONTROLS
========================= */

function setupControls(){

    window.addEventListener(
        "keydown",
        e => {

            keys[e.code] = true;

            if(
                e.code === "Space" &&
                onGround
            ){

                velocityY = .28;

                onGround = false;

            }

            if(
                e.code === "Enter"
            ){

                shoot();

            }

        }
    );


    window.addEventListener(
        "keyup",
        e => {

            keys[e.code] = false;

        }
    );


    document.addEventListener(
        "click",
        e => {

            if(
                started &&
                !e.target.closest(
                    "button"
                )
            ){

                shoot();

            }

        }
    );


    setupMobileButton(
        "up",
        "KeyW"
    );

    setupMobileButton(
        "down",
        "KeyS"
    );

    setupMobileButton(
        "left",
        "KeyA"
    );

    setupMobileButton(
        "right",
        "KeyD"
    );


    document
        .getElementById("jump")
        .addEventListener(
            "pointerdown",
            () => {

                if(onGround){

                    velocityY=.28;

                    onGround=false;

                }

            }
        );


    document
        .getElementById("shoot")
        .addEventListener(
            "pointerdown",
            shoot
        );

}


/* =========================
   MOBILE BUTTON
========================= */

function setupMobileButton(
    id,
    key
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!started) return;


    const bullet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .15,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xffff00
            })
        );


    bullet.position.copy(
        player.position
    );

    bullet.position.y += 2;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        player.quaternion
    );


    bullet.userData.velocity =
        direction.multiplyScalar(.8);


    bullet.userData.life = 120;


    scene.add(bullet);

    bullets.push(bullet);

}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(){

    if(!player) return;


    if(keys["KeyW"] ||
       keys["ArrowUp"]){

        player.translateZ(
            -playerSpeed
        );

    }


    if(keys["KeyS"] ||
       keys["ArrowDown"]){

        player.translateZ(
            playerSpeed
        );

    }


    if(keys["KeyA"] ||
       keys["ArrowLeft"]){

        player.rotation.y += .045;

    }


    if(keys["KeyD"] ||
       keys["ArrowRight"]){

        player.rotation.y -= .045;

    }


    velocityY -= .012;

    player.position.y += velocityY;


    if(player.position.y <= 0){

        player.position.y = 0;

        velocityY = 0;

        onGround = true;

    }


    /* CAMERA */

    const cameraOffset =
        new THREE.Vector3(
            0,
            7,
            12
        );

    cameraOffset.applyQuaternion(
        player.quaternion
    );

    const target =
        player.position
            .clone()
            .add(cameraOffset);


    camera.position.lerp(
        target,
        .12
    );


    camera.lookAt(
        player.position.x,
        player.position.y + 2,
        player.position.z
    );

}


/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies(){

    enemies.forEach(enemy => {

        if(!enemy.parent)
            return;


        const distance =
            enemy.position.distanceTo(
                player.position
            );


        if(distance < 35){

            enemy.lookAt(
                player.position.x,
                enemy.position.y,
                player.position.z
            );


            enemy.translateZ(.025);


            if(distance < 3){

                playerHealth -= .08;

                if(playerHealth <= 0){

                    playerHealth = 0;

                    showMessage(
                        "💀 YOU LOST!"
                    );

                    setTimeout(
                        () => location.reload(),
                        1800
                    );

                }

            }

        }

    });

}


/* =========================
   UPDATE BULLETS
========================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        bullet.position.add(
            bullet.userData.velocity
        );


        bullet.userData.life--;


        let hit = false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const enemy =
                enemies[j];


            if(!enemy.parent)
                continue;


            const distance =
                bullet.position.distanceTo(
                    enemy.position
                );


            if(distance < 2){

                enemy.userData.health--;

                hit = true;


                if(
                    enemy.userData.health <= 0
                ){

                    scene.remove(enemy);

                    enemies.splice(
                        j,
                        1
                    );

                    kills++;

                    document
                        .getElementById("kills")
                        .textContent =
                        kills;

                    showMessage(
                        "☠️ ENEMY ELIMINATED!"
                    );

                }

                break;

            }

        }


        if(
            hit ||
            bullet.userData.life <= 0
        ){

            scene.remove(bullet);

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;

    message.style.opacity =
        "1";


    setTimeout(
        () => {

            message.style.opacity =
                "0";

        },
        900
    );

}


/* =========================
   GAME LOOP
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateEnemies();

    updateBullets();


    document
        .getElementById("health")
        .textContent =
        Math.max(
            0,
            Math.round(playerHealth)
        );


    document
        .getElementById("players")
        .textContent =
        enemies.length + 1;


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        if(!camera || !renderer)
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
