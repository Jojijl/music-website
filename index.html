<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOJIFY — Your Music. Your Vibe.</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #111;
    background-image:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.88)),
        url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px 15px 80px;
}

/* JOJIFY HEADER */

.jojify-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    margin-bottom: 18px;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    backdrop-filter: blur(12px);
}

.jojify-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.logo-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: linear-gradient(135deg,#ff3333,#ff0066);
    color: white;
    font-size: 25px;
    font-weight: bold;
}

.logo-text {
    color: white;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo-tagline {
    color: #aaa;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

.subtitle {
    text-align: center;
    color: #ccc;
    margin: 10px 0 25px;
}

/* SEARCH */

.search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.search-box input {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.search-box button {
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    background: #ff3333;
    color: white;
    font-weight: bold;
}

/* YOUTUBE PLAYER */

.player {
    background: rgba(20,20,20,.9);
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 20px;
}

.youtube {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 15px;
    display: block;
}

.now-playing {
    text-align: center;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

.artist {
    text-align: center;
    color: #aaa;
    margin-top: 6px;
}

/* RESULTS */

.results {
    background: rgba(20,20,20,.9);
    border-radius: 20px;
    padding: 10px;
}

.result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.result:last-child {
    border-bottom: none;
}

.thumbnail {
    width: 90px;
    height: 55px;
    object-fit: cover;
    border-radius: 9px;
}

.info {
    flex: 1;
}

.name {
    font-weight: bold;
}

.artist-name {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
}

.play {
    border: none;
    background: #ff3333;
    color: white;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 17px;
}

.message {
    text-align: center;
    color: #aaa;
    padding: 20px;
}

/* MOBILE */

@media (max-width: 600px) {

    .logo-tagline {
        display: none;
    }

    .logo-text {
        font-size: 22px;
    }

    .logo-icon {
        width: 38px;
        height: 38px;
    }

    .thumbnail {
        width: 75px;
        height: 50px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="jojify-header">

        <a href="#" class="jojify-logo">

            <span class="logo-icon">♫</span>

            <span class="logo-text">
                JOJIFY
            </span>

        </a>

        <span class="logo-tagline">
            YOUR MUSIC. YOUR VIBE.
        </span>

    </header>

    <div class="subtitle">
        Search and listen on YouTube
    </div>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search songs or artists..."
        >

        <button onclick="searchYouTube()">
            Search
        </button>

    </div>

    <div class="player">

        <iframe
            id="youtubePlayer"
            class="youtube"
            src=""
            title="JOJIFY YouTube Player"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

        <div class="now-playing" id="title">
            Select a song
        </div>

        <div class="artist" id="artist">
            JOJIFY
        </div>

    </div>

    <div class="results" id="results">

        <div class="message">
            Search for a song above 🎵
        </div>

    </div>

</div>

<script>

const searchInput =
    document.getElementById("searchInput");

const results =
    document.getElementById("results");

const youtubePlayer =
    document.getElementById("youtubePlayer");

const title =
    document.getElementById("title");

const artist =
    document.getElementById("artist");


function searchYouTube() {

    const term =
        searchInput.value.trim();

    if (!term) {

        results.innerHTML =
            '<div class="message">Type a song or artist name 🎵</div>';

        return;
    }

    /*
       YouTube search page.
       This opens the search results instead of
       trying to download or extract music.
    */

    const searchURL =
        "https://www.youtube.com/results?search_query="
        + encodeURIComponent(term);

    results.innerHTML = `

        <div class="message">

            <p>Search YouTube for:</p>

            <strong>${escapeHTML(term)}</strong>

            <br><br>

            <a
                href="${searchURL}"
                target="_blank"
                style="
                    display:inline-block;
                    padding:12px 20px;
                    background:#ff3333;
                    color:white;
                    text-decoration:none;
                    border-radius:10px;
                    font-weight:bold;
                "
            >
                Open YouTube Search ▶
            </a>

        </div>

    `;
}


function playVideo(videoID, songTitle, songArtist) {

    youtubePlayer.src =
        "https://www.youtube.com/embed/"
        + videoID
        + "?autoplay=1";

    title.textContent =
        songTitle;

    artist.textContent =
        songArtist || "YouTube";

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchYouTube();

        }

    }
);

</script>

</body>
</html>
