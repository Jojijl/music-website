<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOJIFY</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 28px 15px;
    background: #111;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 5px;
}

.subtitle {
    color: #999;
    margin-top: 7px;
}

.search {
    padding: 20px;
    max-width: 700px;
    margin: auto;
}

.search input {
    width: 100%;
    padding: 15px 20px;
    border-radius: 30px;
    border: 1px solid #333;
    background: #171717;
    color: white;
    font-size: 16px;
    outline: none;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 15px 20px;
}

.categories button {
    white-space: nowrap;
    padding: 10px 17px;
    border-radius: 25px;
    border: 1px solid #333;
    background: #151515;
    color: white;
    cursor: pointer;
}

.categories button.active,
.categories button:hover {
    background: white;
    color: black;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 0 15px 40px;
}

.info {
    color: #888;
    font-size: 13px;
    margin-bottom: 15px;
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #131313;
    border: 1px solid #222;
    padding: 13px;
    margin-bottom: 9px;
    border-radius: 12px;
}

.number {
    color: #777;
    width: 30px;
    text-align: center;
}

.details {
    flex: 1;
    min-width: 0;
}

.title {
    font-weight: bold;
}

.meta {
    color: #888;
    font-size: 12px;
    margin-top: 5px;
}

.tag {
    color: #aaa;
    font-size: 11px;
    margin-top: 4px;
}

.play {
    border: 0;
    background: white;
    color: black;
    padding: 9px 14px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #777;
    padding: 50px 10px;
}

footer {
    text-align: center;
    color: #666;
    padding: 30px 15px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">JOJIFY</div>
    <div class="subtitle">Malayalam Music • Your Mood • Your Music</div>
</header>

<div class="search">
    <input
        id="search"
        type="text"
        placeholder="Search song, movie or singer..."
    >
</div>

<div class="categories">

    <button class="active" onclick="category('All', this)">
        All
    </button>

    <button onclick="category('Chill', this)">
        🌙 Chill
    </button>

    <button onclick="category('Sad', this)">
        💔 Sad
    </button>

    <button onclick="category('Happy', this)">
        😊 Happy
    </button>

    <button onclick="category('Romantic', this)">
        ❤️ Romantic
    </button>

    <button onclick="category('Melody', this)">
        🎵 Melody
    </button>

    <button onclick="category('Feel Good', this)">
        ✨ Feel Good
    </button>

</div>

<main>

    <div id="info" class="info"></div>

    <div id="songs"></div>

</main>

<footer>
    JOJIFY © 2026
</footer>


<script>

===================================================== */

/* =====================================================
   CURRENT CATEGORY
===================================================== */

let selectedCategory = "All";


/* =====================================================
   DISPLAY SONGS
===================================================== */

function showSongs() {

    const searchText =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const result = songs.filter(song => {

        const searchMatch =
            song.title.toLowerCase().includes(searchText) ||
            song.artist.toLowerCase().includes(searchText) ||
            song.movie.toLowerCase().includes(searchText);

        const categoryMatch =
            selectedCategory === "All" ||
            song.category === selectedCategory;

        return searchMatch && categoryMatch;
    });


    const container =
        document.getElementById("songs");

    const info =
        document.getElementById("info");


    info.textContent =
        result.length + " songs found";


    if (result.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No songs found.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    result.forEach((song, index) => {

        const div =
            document.createElement("div");

        div.className = "song";

        div.innerHTML = `

            <div class="number">
                ${index + 1}
            </div>

            <div class="details">

                <div class="title">
                    ${song.title}
                </div>

                <div class="meta">
                    ${song.artist} • ${song.movie}
                </div>

                <div class="tag">
                    ${song.category}
                </div>

            </div>

            <button
                class="play"
                onclick="openOnline('${encodeURIComponent(song.title + ' ' + song.artist + ' Malayalam')}')"
            >
                ▶ Play
            </button>

        `;

        container.appendChild(div);

    });

}


/* =====================================================
   CATEGORY FILTER
===================================================== */

function category(name, button) {

    selectedCategory = name;


    document
        .querySelectorAll(".categories button")
        .forEach(btn => {
            btn.classList.remove("active");
        });


    button.classList.add("active");


    showSongs();
}


/* =====================================================
   ONLINE SONG SEARCH
===================================================== */

function openOnline(query) {

    /*
       Opens the song search online.

       No Google Cloud.
       No API key.
       No MP3 hosting.
    */

    window.open(
        "https://www.youtube.com/results?search_query=" + query,
        "_blank"
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener("input", showSongs);


/* =====================================================
   START
===================================================== */

showSongs();

</script>
