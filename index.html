<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>JOJIFY CHAOS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#logo{
    position:absolute;
    top:18px;
    left:18px;
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 2px 8px #000;
}

#logo span{
    color:#00e5ff;
}

#stats{
    position:absolute;
    top:18px;
    right:18px;
    background:rgba(0,0,0,.45);
    padding:10px 14px;
    border-radius:12px;
    font-size:14px;
}

#healthBox{
    position:absolute;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    width:min(330px,70%);
}

#healthText{
    font-weight:bold;
    margin-bottom:5px;
    text-align:center;
    text-shadow:0 2px 5px #000;
}

#healthBar{
    height:14px;
    background:rgba(0,0,0,.6);
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.3);
}

#health{
    width:100%;
    height:100%;
    background:#20e070;
    transition:.15s;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:28px;
    text-shadow:0 2px 5px #000;
}

#message{
    position:absolute;
    left:50%;
    top:15%;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:bold;
    text-align:center;
    text-shadow:0 2px 8px #000;
}

#controls{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.control{
    position:absolute;
    width:64px;
    height:64px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;
    background:rgba(0,0,0,.35);
    color:white;
    font-size:24px;
    pointer-events:auto;
    user-select:none;
    -webkit-user-select:none;
}

#up{
    left:82px;
    bottom:130px;
}

#down{
    left:82px;
    bottom:25px;
}

#left{
    left:12px;
    bottom:78px;
}

#right{
    left:152px;
    bottom:78px;
}

#shoot{
    right:25px;
    bottom:75px;
    width:82px;
    height:82px;
    background:rgba(0,229,255,.25);
    border-color:#00e5ff;
    font-size:30px;
}

#jump{
    right:120px;
    bottom:35px;
}

#start{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#123a4a,#03070a 65%);
    z-index:10;
    color:white;
    text-align:center;
}

.start-card{
    padding:30px;
    max-width:420px;
}

.start-card h1{
    font-size:48px;
    letter-spacing:3px;
}

.start-card h1 span{
    color:#00e5ff;
}

.start-card p{
    color:#aaa;
    margin:12px 0 25px;
}

#startButton{
    border:0;
    background:#00e5ff;
    color:#001014;
    padding:15px 35px;
    border-radius:14px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

@media(min-width:800px){
    #controls{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="start">
    <div class="start-card">
        <h1>JOJ<span>IFY</span></h1>
        <h2>CHAOS</h2>
        <p>
            3D Battle Island — V1
        </p>

        <button id="startButton">
            PLAY NOW 🎮
        </button>

        <p>
            WASD / Arrow Keys · Mouse · Space · Click
        </p>
    </div>
</div>

<div id="hud">

    <div id="logo">
        JOJ<span>IFY</span> CHAOS
    </div>

    <div id="stats">
        👤 Players: <span id="players">10</span><br>
        💀 Eliminations: <span id="kills">0</span>
    </div>

    <div id="message">
        SURVIVE THE CHAOS
    </div>

    <div id="crosshair">
        +
    </div>

    <div id="healthBox">
        <div id="healthText">
            ❤️ 100 HP
        </div>

        <div id="healthBar">
            <div id="health"></div>
        </div>
    </div>

</div>

<div id="controls">

    <button class="control" id="up">▲</button>
    <button class="control" id="down">▼</button>
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>

    <button class="control" id="jump">
        ⬆
    </button>

    <button class="control" id="shoot">
        🔥
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let player;

let started = false;

let velocityY = 0;
let health = 100;
let kills = 0;

const keys = {};

const enemies = [];
const bullets = [];

const clock = new THREE.Clock();

const WORLD_SIZE = 180;


/* =========================
   START GAME
========================= */

document
.getElementById("startButton")
.addEventListener("click",startGame);


function startGame(){

    document
    .getElementById("start")
    .style.display = "none";

    started = true;

    createGame();
}


/* =========================
   CREATE GAME
========================= */

function createGame(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x82c8e8);

    scene.fog =
        new THREE.Fog(
            0x82c8e8,
            80,
            260
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            65,
            innerWidth / innerHeight,
            .1,
            500
        );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );

    renderer.shadowMap.enabled = true;

    document
    .getElementById("game")
    .appendChild(renderer.domElement);


    /* LIGHT */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x335533,
            2
        );

    scene.add(ambient);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        60,
        100,
        30
    );

    sun.castShadow = true;

    scene.add(sun);


    /* ISLAND */

    createIsland();


    /* PLAYER */

    createPlayer();


    /* ENEMIES */

    for(let i=0;i<9;i++){

        createEnemy(
            (Math.random()-.5)*120,
            (Math.random()-.5)*120
        );
    }


    /* CAMERA */

    camera.position.set(
        0,
        8,
        12
    );


    window.addEventListener(
        "resize",
        resize
    );


    setupKeyboard();

    setupMobile();

    animate();
}


/* =========================
   ISLAND
========================= */

function createIsland(){

    const groundGeometry =
        new THREE.CylinderGeometry(
            WORLD_SIZE/2,
            WORLD_SIZE/2,
            3,
            64
        );

    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color:0x3c8c45
        });

    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.position.y = -1.5;

    ground.receiveShadow = true;

    scene.add(ground);


    /* WATER */

    const waterGeometry =
        new THREE.CircleGeometry(
            180,
            64
        );

    const waterMaterial =
        new THREE.MeshStandardMaterial({
            color:0x2185a0,
            roughness:.4,
            metalness:.1
        });

    const water =
        new THREE.Mesh(
            waterGeometry,
            waterMaterial
        );

    water.rotation.x =
        -Math.PI/2;

    water.position.y = -3;

    scene.add(water);


    /* TREES */

    for(let i=0;i<45;i++){

        const x =
            (Math.random()-.5)*150;

        const z =
            (Math.random()-.5)*150;

        if(Math.hypot(x,z)<15)
            continue;

        createTree(x,z);
    }


    /* ROCKS */

    for(let i=0;i<30;i++){

        const x =
            (Math.random()-.5)*150;

        const z =
            (Math.random()-.5)*150;

        createRock(x,z);
    }


    /* BUILDINGS */

    for(let i=0;i<8;i++){

        const x =
            (Math.random()-.5)*120;

        const z =
            (Math.random()-.5)*120;

        createBuilding(x,z);
    }
}


/* =========================
   TREE
========================= */

function createTree(x,z){

    const group =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .5,
                4,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x70452a
            })
        );

    trunk.position.y = 2;

    group.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.3,
                10,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x176b2b
            })
        );

    leaves.position.y = 5;

    group.add(leaves);


    group.position.set(
        x,
        0,
        z
    );

    group.traverse(
        o => o.castShadow = true
    );

    scene.add(group);
}


/* =========================
   ROCK
========================= */

function createRock(x,z){

    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                1 + Math.random()*1.5
            ),
            new THREE.MeshStandardMaterial({
                color:0x626b70
            })
        );

    rock.position.set(
        x,
        1,
        z
    );

    rock.scale.y =
        .6 + Math.random()*.5;

    rock.castShadow = true;

    scene.add(rock);
}


/* =========================
   BUILDING
========================= */

function createBuilding(x,z){

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,
                7,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:
                    Math.random()>.5
                    ? 0x8e5c3d
                    : 0x526575
            })
        );

    building.position.set(
        x,
        3.5,
        z
    );

    building.castShadow = true;

    building.receiveShadow = true;

    scene.add(building);
}


/* =========================
   PLAYER
========================= */

function createPlayer(){

    player =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .65,
                1.3,
                8,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x00d9ff
            })
        );

    body.position.y = 1.4;

    body.castShadow = true;

    player.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .55,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xf0b48a
            })
        );

    head.position.y = 2.65;

    head.castShadow = true;

    player.add(head);


    player.position.set(
        0,
        0,
        0
    );

    scene.add(player);
}


/* =========================
   ENEMY
========================= */

function createEnemy(x,z){

    const enemy =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .65,
                1.2,
                8,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xff3b3b
            })
        );

    enemy.position.set(
        x,
        1.2,
        z
    );

    enemy.castShadow = true;

    enemy.userData.health = 100;

    enemies.push(enemy);

    scene.add(enemy);
}


/* =========================
   KEYBOARD
========================= */

function setupKeyboard(){

    window.addEventListener(
        "keydown",
        e => {

            keys[e.code] = true;

            if(
                e.code === "Space"
            ){
                jump();
            }

            if(
                e.code === "Enter"
            ){
                shoot();
            }
        }
    );


    window.addEventListener(
        "keyup",
        e => {

            keys[e.code] = false;
        }
    );


    renderer.domElement.addEventListener(
        "click",
        shoot
    );
}


/* =========================
   MOBILE
========================= */

function setupMobile(){

    const buttons = {

        up:"KeyW",
        down:"KeyS",
        left:"KeyA",
        right:"KeyD"

    };


    for(
        const id in buttons
    ){

        const btn =
            document.getElementById(id);

        const key =
            buttons[id];


        btn.addEventListener(
            "pointerdown",
            e => {

                e.preventDefault();

                keys[key] = true;
            }
        );


        btn.addEventListener(
            "pointerup",
            e => {

                e.preventDefault();

                keys[key] = false;
            }
        );


        btn.addEventListener(
            "pointercancel",
            () => {

                keys[key] = false;
            }
        );
    }


    document
    .getElementById("jump")
    .addEventListener(
        "pointerdown",
        jump
    );


    document
    .getElementById("shoot")
    .addEventListener(
        "pointerdown",
        shoot
    );
}


/* =========================
   JUMP
========================= */

function jump(){

    if(
        player &&
        player.position.y <= .05
    ){

        velocityY = 11;
    }
}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!started)
        return;


    const bullet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .15,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xffff00
            })
        );


    bullet.position.copy(
        player.position
    );

    bullet.position.y += 1.5;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        player.quaternion
    );


    bullet.userData.velocity =
        direction.multiplyScalar(45);


    bullet.userData.life = 2;

    bullets.push(bullet);

    scene.add(bullet);
}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(delta){

    let moveX = 0;
    let moveZ = 0;


    if(
        keys["KeyW"] ||
        keys["ArrowUp"]
    ) moveZ -= 1;

    if(
        keys["KeyS"] ||
        keys["ArrowDown"]
    ) moveZ += 1;

    if(
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) moveX -= 1;

    if(
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) moveX += 1;


    const length =
        Math.hypot(
            moveX,
            moveZ
        );


    if(length > 0){

        moveX /= length;
        moveZ /= length;


        const speed = 18;

        player.position.x +=
            moveX * speed * delta;

        player.position.z +=
            moveZ * speed * delta;


        player.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            );
    }


    velocityY -=
        25 * delta;

    player.position.y +=
        velocityY * delta;


    if(
        player.position.y < 0
    ){

        player.position.y = 0;

        velocityY = 0;
    }


    const limit =
        WORLD_SIZE/2 - 5;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -limit,
            limit
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -limit,
            limit
        );


    /* CAMERA */

    const cameraTarget =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 3,
            player.position.z
        );


    const desiredCamera =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 9,
            player.position.z + 13
        );


    camera.position.lerp(
        desiredCamera,
        .08
    );


    camera.lookAt(
        cameraTarget
    );
}


/* =========================
   ENEMIES
========================= */

function updateEnemies(delta){

    enemies.forEach(
        enemy => {

            if(
                enemy.userData.health <= 0
            )
                return;


            const distance =
                enemy.position.distanceTo(
                    player.position
                );


            if(
                distance < 45
            ){

                enemy.lookAt(
                    player.position.x,
                    enemy.position.y,
                    player.position.z
                );


                if(distance > 5){

                    enemy.translateZ(
                        -4 * delta
                    );

                }else{

                    health -=
                        12 * delta;

                    updateHealth();

                }
            }
        }
    );
}


/* =========================
   BULLETS
========================= */

function updateBullets(delta){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        bullet.position.add(
            bullet.userData.velocity
            .clone()
            .multiplyScalar(delta)
        );


        bullet.userData.life -=
            delta;


        let remove = false;


        enemies.forEach(
            enemy => {

                if(
                    enemy.userData.health <= 0
                )
                    return;


                if(
                    bullet.position.distanceTo(
                        enemy.position
                    ) < 1.5
                ){

                    enemy.userData.health -=
                        50;

                    remove = true;


                    if(
                        enemy.userData.health <= 0
                    ){

                        scene.remove(
                            enemy
                        );

                        kills++;

                        document
                        .getElementById(
                            "kills"
                        )
                        .textContent =
                            kills;

                    }
                }
            }
        );


        if(
            bullet.userData.life <= 0
        )
            remove = true;


        if(remove){

            scene.remove(
                bullet
            );

            bullets.splice(
                i,
                1
            );
        }
    }
}


/* =========================
   HEALTH
========================= */

function updateHealth(){

    health =
        Math.max(
            0,
            health
        );


    document
    .getElementById("health")
    .style.width =
        health + "%";


    document
    .getElementById("healthText")
    .textContent =
        "❤️ " +
        Math.round(health) +
        " HP";


    if(
        health <= 0
    ){

        document
        .getElementById("message")
        .textContent =
            "💀 YOU WERE ELIMINATED";

        started = false;
    }
}


/* =========================
   RESIZE
========================= */

function resize(){

    if(!camera || !renderer)
        return;


    camera.aspect =
        innerWidth /
        innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
}


/* =========================
   GAME LOOP
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!started){

        renderer.render(
            scene,
            camera
        );

        return;
    }


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(delta);

    updateEnemies(delta);

    updateBullets(delta);


    renderer.render(
        scene,
        camera
    );
}

</script>

</body>
</html>
